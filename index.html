/* log every read; compare with what is finally saved */
const normV=v=>v==null?'':String(v).toUpperCase().replace(/\s+/g,' ').replace(/[.,]$/,'').trim();
function sameV(a,b){if(a==null||a===''||b==null||b==='')return false;const na=+String(a).replace(/,/g,''),nb=+String(b).replace(/,/g,'');if(!isNaN(na)&&!isNaN(nb)&&String(a).match(/^[\d,.]+$/)&&String(b).match(/^[\d,.]+$/))return Math.abs(na-nb)<=1;return normV(a)===normV(b)}
const emp=v=>v==null||v===''||v===0||v==='0';
function grade(read,saved){const out={};Object.keys(read).forEach(k=>{const r=read[k],s=saved[k],re=emp(r),se=emp(s);if(re&&se)return;out[k]=re?'missed':se?'corrected':sameV(r,s)?'correct':'corrected'});return out}
const viaOf=()=>/Read by Claude/.test(ui.piMsg||ui.ocr||'')?'Claude':/scanned|page/i.test(ui.piMsg||ui.ocr||'')?'On device (scan)':'On device';
const _rp18=readPi;readPi=async function(f){LASTTEXT='';await _rp18(f);const b=bond(ui.bond);if(!b||!ui.piX)return;
  const read={};PIF.forEach(([,, ,k])=>read[k]=ui.piX[k]??null);const log={id:uid('rd'),t:now(),doc:'PI',file:f.name,via:/Read by Claude/.test(ui.piMsg)?'Claude':LASTTEXT&&/scan/i.test(ui.piMsg)?'On device (scan)':'On device',insurer:b.insurer,by:me().name,read,labelsUsed:0};
  (b.readLogs=b.readLogs||[]).push(log);ui.piRead={logId:log.id,text:LASTTEXT};save()};
const _ps18=A.piSave;A.piSave=()=>{const b=bond(ui.bond),pr=ui.piRead;_ps18();if(!b.pi||!pr)return;const log=(b.readLogs||[]).find(x=>x.id===pr.logId);if(!log||log.outcome)return;
  const saved={};PIF.forEach(([,, ,k])=>saved[k]=b.pi[k]);log.outcome=grade(log.read,saved);log.savedAt=now();ui.piRead=null;save();
  const bad=Object.entries(log.outcome).filter(([,o])=>o!=='correct');if(!bad.length||!pr.text||!can('masters','create'))return;
  const sug=[];bad.forEach(([k])=>{const f=PIF.find(x=>x[3]===k);if(!f)return;const lab=findLabel(pr.text,saved[k],f[2]);if(lab&&!labelsFor(b.insurer).some(l=>l.field===f[1]&&l.label.toLowerCase()===lab.toLowerCase()))sug.push({field:f[1],label:lab,value:saved[k]})});
  if(sug.length)setTimeout(()=>teachModal(b.insurer,sug),60)};
function valVariants(v,type){if(v==null||v==='')return [];if(type==='amount'){const n=+v;return uniq([n.toLocaleString('en-IN'),n.toLocaleString('en-US'),String(n),n.toFixed(2),n.toLocaleString('en-IN',{minimumFractionDigits:2})])}
  if(type==='date'){const [y,m,d]=String(v).split('-');return [d+'.'+m+'.'+y,d+'-'+m+'-'+y,d+'/'+m+'/'+y,+d+'.'+(+m)+'.'+y]}return [String(v)]}
function findLabel(text,v,type){const t=String(text||'').replace(/\s+/g,' ');for(const s of valVariants(v,type)){let i=t.indexOf(s);if(i<0)i=t.toLowerCase().indexOf(String(s).toLowerCase());if(i<0)continue;
  const pre=t.slice(Math.max(0,i-80),i).replace(/[\s:\-–.]+$/,''),w=pre.split(' ').filter(Boolean);
  for(const k of [2,3,1,4]){if(w.length<k)continue;const lab=w.slice(-k).join(' ').replace(/^[^A-Za-z(]+/,'');if(lab.length<3||/^\d/.test(lab))continue;const got=byLabel(t,lab,type);if(got!=null&&sameV(got,v))return lab}}return null}
function teachModal(ins,sug){ui.modal={kind:'teach',ins,sug};modal(`<h2>Teach Bond Desk ${esc(ins)}'s PI layout?</h2><p class="lead">You corrected or filled these fields. Bond Desk found where they sit on this PI. Save the labels and the next ${esc(ins)} PI reads them by itself.</p>
  ${tbl('<th></th><th>Field</th><th>Your value</th><th>Label on the PI</th>',sug.map((s,i)=>`<tr><td><input type="checkbox" id="tc_${i}" checked aria-label="Save"></td><td>${esc(s.field)}</td><td>${esc(String(s.value))}</td><td><input id="tl_${i}" value="${esc(s.label)}"></td></tr>`).join(''))}
  <div class="foot"><button class="btn" data-a="closeModal">Not now</button><button class="btn p" data-a="teachGo">Save labels</button></div>`)}
A.teachGo=()=>{const m=ui.modal;let n=0;S.m.piLabels=S.m.piLabels||[];m.sug.forEach((s,i)=>{if(!$('#tc_'+i).checked)return;const lab=val('tl_'+i);if(!lab)return;S.m.piLabels.push({id:uid('m'),insurer:m.ins,field:s.field,label:lab,note:'Learned from a correction',active:true,createdAt:now(),createdBy:me().name});n++});
  closeModal();if(n){audit('Masters','PI reading labels learned',m.ins,n+' label(s)');save();render();toast(n+' label(s) saved for '+m.ins+'.')}};

/* LOA / tender reads on New request */
const _rt18=runTenderOCR;runTenderOCR=async function(file){const b=ui.draft;LASTTEXT='';await _rt18(file);if(!b||!XF.size)return;const read={};REQF.forEach(([k])=>read[k]=XF.has(k)?getPath(b,k):null);
  (b.readLogs=b.readLogs||[]).push({id:uid('rd'),t:now(),doc:/\(LOA\)/.test(ui.ocr)?'LOA':/\(PO\)/.test(ui.ocr)?'PO':'Tender',file:file.name,via:/Read by Claude/.test(ui.ocr)?'Claude':/scan|page/i.test(ui.ocr)?'On device (scan)':'On device',insurer:'',by:me().name,read});keepDraft(b)};
const _sr18=A.submitReq;A.submitReq=()=>{const b=ui.draft;_sr18();if(!b||b.status!=='open')return;let ch=false;(b.readLogs||[]).forEach(l=>{if(l.doc!=='PI'&&!l.outcome){const saved={};REQF.forEach(([k])=>saved[k]=getPath(b,k));l.outcome=grade(l.read,saved);l.savedAt=now();ch=true}});if(ch)save()};

/* report */
NAV.find(g=>g[0]==='Setup')[1].splice(-1,0,['reading','Reading accuracy']);
RPERM.reading=['audit','view'];TITLES.reading=['Reading accuracy','How well PIs, LOAs and tenders are read, by field, insurer and method'];
const allReads=()=>S.bonds.flatMap(b=>(b.readLogs||[]).map(l=>({...l,b})));
function tally(L){const c={correct:0,corrected:0,missed:0};L.forEach(l=>Object.values(l.outcome||{}).forEach(o=>c[o]++));c.n=c.correct+c.corrected+c.missed;c.acc=c.n?c.correct/c.n*100:null;return c}
const accCell=c=>c.acc==null?'<span class="mu">—</span>':`<div class="row c" style="flex-wrap:nowrap;gap:8px"><div class="meter" style="width:110px"><i class="u" style="width:${c.acc}%;background:${c.acc>=90?'var(--ok)':c.acc>=70?'var(--wa)':'var(--er)'}"></i></div><b>${c.acc.toFixed(0)}%</b></div>`;
function groupTally(L,keyFn,cols){const g={};L.forEach(l=>{const k=keyFn(l);if(k==null)return;(g[k]=g[k]||[]).push(l)});return Object.entries(g).map(([k,v])=>({k,c:tally(v),docs:v.length})).sort((a,b)=>b.docs-a.docs)}
VIEWS.reading=()=>{const R=allReads(),done=R.filter(l=>l.outcome),pend=R.filter(l=>!l.outcome),T=tally(done);
  const fieldRows={};done.forEach(l=>Object.entries(l.outcome).forEach(([k,o])=>{const n=l.doc+'|'+k;(fieldRows[n]=fieldRows[n]||{doc:l.doc,k,correct:0,corrected:0,missed:0})[o]++}));
  const FR=Object.values(fieldRows).map(r=>({...r,n:r.correct+r.corrected+r.missed})).map(r=>({...r,acc:r.n?r.correct/r.n*100:null})).sort((a,b)=>(a.acc??101)-(b.acc??101));
  const tb=(head,rows)=>tbl(head,rows,'Nothing read yet.');
  const TL=TBL.reads={key:'reads',cols:[{k:'t',l:'Read on',g:l=>(l.t||'').slice(0,10),d:1},{k:'d',l:'Document',g:l=>l.doc},{k:'r',l:'Bond request',g:l=>l.b.ref||'Draft'},{k:'i',l:'Insurer',g:l=>l.insurer||''},{k:'v',l:'Method',g:l=>l.via},{k:'f',l:'File',g:l=>l.file},{k:'a',l:'Accuracy',g:l=>l.outcome?Math.round(tally([l]).acc??0):'',n:1},{k:'c',l:'Corrected / missed',g:l=>Object.entries(l.outcome||{}).filter(([,o])=>o!=='correct').map(([k,o])=>fieldName(l.doc,k)+(o==='missed'?' (missed)':'')).join(', ')},{k:'s',l:'Status',g:l=>l.outcome?'Checked':'Not saved yet'}],rows:()=>allReads().sort((a,b)=>(b.t||'').localeCompare(a.t||''))};
  const rows=ftRows(TL);
  return `<div class="stats"><div class="stat"><small>Documents read</small><strong>${R.length}</strong><span class="s2">${done.length} checked · ${pend.length} not saved yet</span></div>
   <div class="stat"><small>Field accuracy</small><strong>${T.acc==null?'—':T.acc.toFixed(0)+'%'}</strong><span class="s2">${T.correct} of ${T.n} fields read right first time</span></div>
   <div class="stat"><small>Fields corrected</small><strong>${T.corrected}</strong><span class="s2">${T.missed} missed (left empty, filled by hand)</span></div>
   <button class="stat" data-a="toLabels"><small>Document templates</small><strong>${MA('docTemplates').length}</strong><span class="s2">Open Masters → Document templates</span></button></div>
  <div class="panel"><h2>How this is measured</h2><p class="mu" style="margin:0">Each time a document is read, Bond Desk keeps what it found. When the PI is saved (or the request submitted), it compares that with what was saved: unchanged = <b>correct</b>, changed = <b>corrected</b>, empty but filled by hand = <b>missed</b>. Fields that were empty both times are not counted.</p></div>
  <div class="ov2"><div class="panel"><h2>By field</h2>${tb('<th>Document</th><th>Field</th><th class="n">Correct</th><th class="n">Corrected</th><th class="n">Missed</th><th>Accuracy</th>',FR.map(r=>`<tr><td>${esc(r.doc)}</td><td>${esc(fieldName(r.doc,r.k))}</td><td class="n">${r.correct}</td><td class="n">${r.corrected}</td><td class="n">${r.missed}</td><td>${accCell(r)}</td></tr>`).join(''))}</div>
  <div><div class="panel"><h2>By insurer (PIs)</h2>${tb('<th>Insurer</th><th class="n">PIs</th><th>Accuracy</th><th class="n">Labels</th>',groupTally(done.filter(l=>l.doc==='PI'),l=>l.insurer).map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${x.docs}</td><td>${accCell(x.c)}</td><td class="n">${labelsFor(x.k).length}</td></tr>`).join(''))}</div>
  <div class="panel"><h2>By method</h2>${tb('<th>Method</th><th class="n">Documents</th><th>Accuracy</th>',groupTally(done,l=>l.via).map(x=>`<tr><td>${esc(x.k)}</td><td class="n">${x.docs}</td><td>${accCell(x.c)}</td></tr>`).join(''))}
   <p class="mu" style="margin:8px 0 0">Claude = read on claude.ai. On device = read in the browser (Render). Scan = page images turned into text first.</p></div></div></div>
  <div class="panel">${ftBar(TL,'Search reads',can('audit','export')?'<button class="btn" data-a="readXl">Export to Excel</button>':'')}<div class="tw"><table><thead><tr>${ftHead(TL)}</tr></thead><tbody>${rows.map(l=>`<tr><td class="w">${fdt(l.t)}</td><td>${esc(l.doc)}</td><td class="w"><button class="btn link" data-a="openBond" data-id="${l.b.id}">${esc(l.b.ref||'Draft')}</button></td><td>${esc(l.insurer||'')}</td><td>${esc(l.via)}</td><td>${esc(l.file)}</td><td class="n">${l.outcome?accCell(tally([l])):''}</td><td>${esc(TL.cols[7].g(l))}</td><td>${l.outcome?pill('Checked','ok'):pill('Not saved yet','gr')}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No reads yet. Attach a PI at Step 4, or read an LOA on New request.</td></tr>'}</tbody></table></div></div>`};
A.toLabels=()=>{ui.mst='docTemplates';go('masters')};

<script>

function mapRows(rows,C){const norm=s=>String(s||'').toLowerCase().replace(/\(.*?\)|\*/g,'').replace(/[^a-z0-9]+/g,' ').trim();const hd=(rows[0]||[]).map(norm),col=f=>hd.findIndex(h=>h===norm(f[1]));const miss=C.filter(f=>f[2]&&col(f)<0).map(f=>f[1]);if(miss.length)return {miss};
  const out=[];rows.slice(1).forEach((r,ri)=>{if(!r.some(x=>String(x??'').trim()))return;if(/^example row/i.test(String(r[r.length-1]??'')))return;const o={},bad=[];
    C.forEach(f=>{const i=col(f);let v=i<0?'':r[i];if(f[3]==='date'){const d=toIso(v);if(d===null)bad.push(f[1]+': “'+v+'” is not a date');o[f[0]]=d||''}else if(f[3]==='num'){const n=v===''||v==null?null:+String(v).replace(/[^\d.\-]/g,'');if(v!==''&&v!=null&&isNaN(n))bad.push(f[1]+': not a number');o[f[0]]=n}
      else if(f[3]==='bool')o[f[0]]=String(v).trim()===''?null:/^(y|yes|true|1)$/i.test(String(v).trim());
      else if(f[3]==='multi'){const op=f[4]?f[4]():[];o[f[0]]=String(v||'').split(/[,;]/).map(x=>x.trim()).filter(Boolean).map(x=>{const m=op.find(q=>q.toLowerCase()===x.toLowerCase());if(!m)bad.push(f[1]+': '+x+' not found');return m||x})}
      else if(f[3]==='sel'){const s=String(v??'').trim(),op=f[4]?f[4]():[];if(s){const m=op.find(q=>String(q).toLowerCase()===s.toLowerCase());if(!m)bad.push(f[1]+': '+s+' not in the list');o[f[0]]=m||s}else o[f[0]]=''}else o[f[0]]=String(v??'').trim();
      if(f[2]&&(o[f[0]]===''||o[f[0]]==null||(Array.isArray(o[f[0]])&&!o[f[0]].length)))bad.push(f[1]+' is empty')});

function pjMember(P){const m=me();if(!m||!P)return null;if(P.createdBy&&P.createdBy===m.id&&!P.implicit)return 'edit';const em=String(m.email||'').toLowerCase();let lv=null;const up=l=>{if(l==='edit')lv='edit';else if(!lv)lv='view'};

['newBond','newExt','newAmd'];NAV[1][1].splice(3,0,['projects','Projects']);NAV_IC.projects='▣';RPERM.projects=['register','view'];

A.pjShortEdit=el=>{const P=pjFind(el.dataset.id);if(!P)return;ui.modal={kind:'pjshort',id:P.id};modal(`<h2>Short name</h2><p class="lead">Shown in the project list and on the project page. The full project name stays as it is, because it links the bonds.</p><div class="grid">${fld('Full project name','<input readonly value="'+esc(P.name)+'">','','full')}${fld('Short name','<input id="pjShortIn" maxlength="60" value="'+esc(P.short||'')+'" placeholder="e.g. BPCL Mumbai">','Leave empty to show the full name.','full')}</div><div class="foot"><button class="btn" data-a="closeModal">Cancel</button><button class="btn p" data-a="pjShortGo">Save</button></div>`)};

function pjOverview(P,bs){const roots=bs.filter(b=>b.kind==='new'),lv=pjLive(roots),op=roots.filter(b=>b.status==='open'),soon=lv.filter(b=>b.expiry&&dBetween(TODAY,b.expiry)<=90).sort((a,c)=>String(a.expiry).localeCompare(String(c.expiry))),lap=roots.filter(b=>lapsedB(b)||b.status==='released'),canc=roots.filter(b=>['cancelled','withdrawn','rejected'].includes(b.status)),prem=roots.filter(b=>premOf(b)>0),pt=prem.reduce((a,b)=>a+premOf(b),0);

function pjBondsTab(P,bs){const lvl=pjLevel(P),canR=can('lifecycle','create')||isCso();
  const rows=bs.slice().sort((a,c)=>String(c.createdAt||'').localeCompare(String(a.createdAt||''))).map(b=>{const live=b.kind==='new'&&b.status==='issued';return `<tr><td class="w"><button class="btn link" data-a="openBond" data-id="${b.id}">${esc(b.ref||'Draft')}</button></td><td>${esc(KIND_L[b.kind]||'')}${b.parentId?' <span class="mu">of '+esc((dbAll().find(y=>y.id===b.parentId)||{}).ref||'')+'</span>':''}</td><td>${esc(b.final?.bondNo||'')}</td><td>${esc(b.type||'')}</td><td>${esc(b.insurer||'')}</td><td>${statusPill(b)}</td><td class="w"><button class="btn link" data-a="verOpen" data-id="${b.id}">${esc(verOf(b))}</button></td><td class="n w">${money(b.amount,curOf(b))}</td><td class="w">${fd(b.expiry)}</td><td>${live&&lvl==='edit'&&canR?`<div class="acts"><button class="btn sm p" data-a="raiseFor" data-id="${b.id}" data-k="ext">Raise extension</button><button class="btn sm" data-a="raiseFor" data-id="${b.id}" data-k="amd">Raise amendment</button></div>`:''}</td></tr>`}).join('');
  return `<div class="panel" style="margin-top:12px"><div class="row c" style="justify-content:space-between"><div><h2>Bonds in this project</h2><span class="mu">New bonds, extensions and amendments. Raise an extension or amendment straight from a live bond.</span></div>${pjCanNew()?'<button class="btn p" data-a="pjNewPick">＋ New</button>':''}</div><div style="margin-top:10px">${tbl('<th>Request</th><th>Kind</th><th>Bond number</th><th>Bond type</th><th>Insurer</th><th>Status</th><th>Version</th><th class="n">Amount</th><th>Expiry</th><th></th>',rows,'No bonds in this project yet.')}</div></div>`}
function pjFinalDocs(b){const out=[];docsOf(b).forEach(x=>{if(x.stage==='4 · Draft bond')return;if(['4 · PI','5 · Issued','6 · Closure','Return','Invocation'].includes(x.stage)&&x.f)out.push(x)});const fr=draftRounds(b).find(r=>r.review?.decision==='final');if(fr&&fr.file)out.push({b,stage:'4 · Draft bond',doc:'Final draft v'+fr.v,f:fr.file});return out.sort((a,c)=>a.stage.localeCompare(c.stage))}
function pjDocsTab(P,bs){const all=!!ui.pjAllF,docsFor=b=>all?docsOf(b).filter(x=>x.f):pjFinalDocs(b),roots=bs.filter(b=>b.kind==='new'||!bs.some(y=>y.id===b.parentId));
  const fold=r=>{const kids=bs.filter(y=>y.parentId===r.id),L=[...docsFor(r).map(x=>({...x,own:1})),...kids.flatMap(k=>docsFor(k).map(x=>({...x,doc:(KIND_L[k.kind]||'Change')+' '+(k.ref||'')+' · '+x.doc})))];
    return `<details class="fold" ${L.length?'open':''}><summary><span>📁 ${esc(r.ref||'Draft')}</span><span class="mu">${esc(r.final?.bondNo||'not issued yet')} · ${esc(r.type||'')}</span>${statusPill(r)}<span class="mu" style="margin-left:auto">${L.length} file(s)</span></summary>${tbl('<th>Step</th><th>Document</th><th>Uploaded</th><th>By</th><th>File</th>',L.map(x=>`<tr><td class="w">${esc(x.stage)}</td><td>${esc(x.doc)}</td><td class="w">${x.f?.at?fdt(x.f.at):'—'}</td><td>${esc(x.f?.by||'')}</td><td>${fileChip(x.f)}</td></tr>`).join(''),all?'No files yet.':'No final files yet. They appear here once the bond is issued.')}</details>`};
  return `<div class="panel" style="margin-top:12px"><div class="row c" style="justify-content:space-between"><div><h2>Documents by bond</h2><span class="mu">One folder per bond. Each folder holds the final files: final draft, issued bond, endorsements, PI and tax invoice. ${FILE_NOTE}</span></div><button class="btn" data-a="pjAll">${all?'Show final files only':'Show every file'}</button></div></div>${roots.map(fold).join('')||'<div class="panel"><p class="mu">No bonds in this project yet.</p></div>'}`}
function pjAccessTab(P,mng){const cr=P.createdBy&&U(P.createdBy);
  return `<div class="panel" style="margin-top:12px"><div class="row c" style="justify-content:space-between"><div><h2>Who can see this project</h2><span class="mu">CSO team sees every project. People and departments added here see the project and all its bonds, whatever their own department. <b>View</b> = read only. <b>Full edit</b> = can raise bonds, extensions and amendments, upload and reply.</span></div>${mng?'<button class="btn p" data-a="pjMng">＋ Add people / departments</button>':''}</div>
  <h3 style="margin-top:12px">People</h3>${tbl('<th>Person</th><th>Access</th><th></th>',(cr?`<tr><td><b>${esc(cr.name)}</b> <span class="mu">${esc(cr.email||'')}</span></td><td>${pill('Owner · full edit','ok')}</td><td></td></tr>`:'')+(P.members||[]).map((p,i)=>`<tr><td><b>${esc(pocName(p))}</b>${p.uid?`<div class="mu">${esc(U(p.uid)?.email||'')}</div>`:'<div class="mu">Not a user yet: gets access when they sign in with this email</div>'}</td><td>${mng?`<select data-ch="pjLvl" data-w="m" data-i="${i}">${opts([['view','View'],['edit','Full edit']],p.level)}</select>`:pill(p.level==='edit'?'Full edit':'View','gr')}</td><td>${mng?`<button class="btn sm d" data-a="pjDel" data-w="m" data-i="${i}">Remove</button>`:''}</td></tr>`).join(''),'No people added yet.')}
  <h3 style="margin-top:12px">Departments</h3>${tbl('<th>Department</th><th>Access</th><th></th>',(P.bus||[]).map((x,i)=>`<tr><td><b>${esc(x.name)}</b></td><td>${mng?`<select data-ch="pjLvl" data-w="b" data-i="${i}">${opts([['view','View'],['edit','Full edit']],x.level)}</select>`:pill(x.level==='edit'?'Full edit':'View','gr')}</td><td>${mng?`<button class="btn sm d" data-a="pjDel" data-w="b" data-i="${i}">Remove</button>`:''}</td></tr>`).join(''),'No department added yet.')}</div>`}
A.pjMng=()=>{let P=pjFind(ui.pjId);if(!P)return;const have=new Set((P.members||[]).map(p=>p.uid).filter(Boolean)),haveB=new Set((P.bus||[]).map(x=>x.name)),users=ACCESS.users.filter(u=>u.active!==false&&u.id!==P.createdBy&&!have.has(u.id));ui.modal={kind:'pjmng'};
  modal(`<h2>Share project</h2><p class="lead">Add people by name or email, or a whole department.</p><div class="grid">${fld('Access for everyone added below','<select id="pjLv"><option value="view">View</option><option value="edit">Full edit</option></select>')}${fld('Add by email (comma separated)','<input id="pjMail" placeholder="asha@zetwerk.com, ravi@zetwerk.com">')}</div>
  ${fld('Pick users',`<input id="pjUq" data-in="pjUq" placeholder="Search name or email" style="margin-bottom:6px"><div class="fl" id="pjUsers" style="max-height:200px">${users.map(u=>`<label class="ck"><input type="checkbox" value="${u.id}"> <b>${esc(u.name)}</b> <span class="mu">${esc(u.email||'')} · ${esc(roleOf(u).name)}${u.bu?' · '+esc(u.bu):''}</span></label>`).join('')||'<span class="mu">Everyone is already added.</span>'}</div>`,'','full')}
  ${fld('Departments',`<div class="fl" id="pjBus2" style="max-height:140px">${MA('bus').filter(x=>!haveB.has(x.name)).map(x=>`<label class="ck"><input type="checkbox" value="${esc(x.name)}"> ${esc(x.name)}</label>`).join('')||'<span class="mu">All departments are added.</span>'}</div>`,'','full')}
  <div class="foot"><button class="btn" data-a="closeModal">Cancel</button><button class="btn p" data-a="pjAddGo">Add</button></div>`,true)};
CH.pjUq=el=>{const q=el.value.toLowerCase();$$('#pjUsers label').forEach(l=>l.style.display=l.textContent.toLowerCase().includes(q)?'':'none')};
A.pjAddGo=()=>{let P=pjFind(ui.pjId);if(!P)return;const lv=val('pjLv')||'view',ids=$$('#pjUsers input:checked').map(x=>x.value),bus=$$('#pjBus2 input:checked').map(x=>x.value),mails=String(val('pjMail')||'').split(/[,;\s]+/).map(x=>x.trim().toLowerCase()).filter(Boolean),bad=mails.filter(x=>!/^\S+@\S+\.\S+$/.test(x));
  if(bad.length)return toast('Check this email: '+bad[0],1);if(!ids.length&&!bus.length&&!mails.length)return toast('Pick a person, an email or a department first.',1);
  P=pjEnsure(P);P.members=P.members||[];P.bus=P.bus||[];const add=[];
  const push=o=>{if(o.uid&&(o.uid===P.createdBy||P.members.some(p=>p.uid===o.uid)))return;if(o.email&&P.members.some(p=>p.email===o.email||(p.uid&&String(U(p.uid)?.email||'').toLowerCase()===o.email)))return;P.members.push({...o,level:lv,at:now(),by:me().name});add.push(o.uid?U(o.uid)?.name:o.email)};
  ids.forEach(id=>push({uid:id}));mails.forEach(m=>{const u=ACCESS.users.find(x=>String(x.email||'').toLowerCase()===m);push(u?{uid:u.id}:{email:m})});
  bus.forEach(n=>{if(!P.bus.some(x=>x.name===n)){P.bus.push({name:n,level:lv,at:now(),by:me().name});add.push(n+' (dept)')}});
  if(!add.length)return toast('Everyone you picked already has access.',1);audit('Project','Access added',P.name,add.join(', ')+' · '+(lv==='edit'?'full edit':'view'));closeModal();save();render();toast('Shared with '+add.length+'.')};
CH.pjLvl=el=>{const P=pjFind(ui.pjId);if(!P)return;const L=el.dataset.w==='b'?P.bus:P.members,x=L[+el.dataset.i];if(!x)return;x.level=el.value;audit('Project','Access changed',P.name,(x.name||pocName(x))+' → '+(x.level==='edit'?'full edit':'view'));save();render()};
A.pjDel=el=>{const P=pjFind(ui.pjId);if(!P)return;const L=el.dataset.w==='b'?P.bus:P.members,x=L[+el.dataset.i];if(!x)return;L.splice(+el.dataset.i,1);audit('Project','Access removed',P.name,x.name||pocName(x));save();render()};
VIEWS.projects=()=>ui.pjId?pjDetail():pjIndex();
</script>
<script>boot();</script>
