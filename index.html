  modal(`<h2>Select ${esc(i.name)}</h2><p class="lead">Choose how the proposal goes to the insurer. Direct is always available, for every bond type and BU.</p>${fld('Route','<select id="insRoute">'+opts(routes,routes[0])+'</select>')}${af<0?`<div class="note w" style="margin-top:12px">This bond takes ${esc(i.name)} ${money(-af,u.c)} over its recorded line. You can still go ahead; it is flagged as over limit.</div>`:''}
  <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="pickInsGo">Select insurer</button></div>`)};
A.pickInsGo=()=>{const b=bond(ui.bond),n=ui.modal.n,r=val('insRoute');const u=util(n);b.insurer=n;b.broker=r;b.overLimit=u.avail-(+b.amount||0)<0;b.insDocs=packFor(n);b.insPackOk=null;closeModal();blog(b,'Limit checked. Insurer selected: '+n+' · '+r+(b.overLimit?' (over line, flagged)':'')+'.');save();render()};
A.chgIns=()=>confirmBox('Change insurer?','This clears the insurer, route, insurer document pack and quote for '+esc(bond(ui.bond).ref)+'. Request documents stay as they are.','Change insurer',r=>{const b=bond(ui.bond),old=b.insurer;b.insurer='';b.broker='';b.insDocs=[];b.insPackOk=null;b.quote=null;b.overLimit=false;(b.docReqs||[]).filter(x=>x.pack==='insurer'&&!x.closedAt).forEach(x=>{x.closedAt=now();x.closedBy=me().name;x.outcome='Insurer changed'});blog(b,'Insurer changed: '+old+' removed. Reason: '+r+'.');save();render()},{reason:true});
A.packOk=()=>{const b=bond(ui.bond),miss=(b.insDocs||[]).filter(d=>!d.file);const go2=()=>{const r=openReq(b,'insurer');if(r){r.closedAt=now();r.closedBy=me().name;r.outcome='Accepted'}b.insPackOk={at:now(),by:me().name};blog(b,'Insurer document pack accepted.');save();render()};
  if(!(b.insDocs||[]).length)return toast('Add the documents the insurer asks for first.',1);
  if(miss.length)confirmBox('Accept the pack with gaps?',miss.map(d=>esc(d.name)).join(', ')+' have no file yet.','Accept anyway',go2);else go2()};
A.sendApproval=()=>{const b=bond(ui.bond),rate=num(val('qRate')),prem=num(val('qPrem'));if(rate==null||prem==null)return toast('Enter the premium rate and quoted premium.',1);
  b.quote={rate,premium:prem,date:val('qDate')||TODAY,remarks:val('qRm'),at:now(),by:me().name};setStep(b,'approval');b.approval={status:'pending',band:bandLabel(b)};blog(b,'Quote recorded: '+rate+'% = '+full(prem,curOf(b))+' + GST. Sent for internal approval.');save();render();toast('Sent for internal approval.')};

/* Step 3 */
function stApproval(b){const okA=canApprove(b),c=curOf(b);
  const body=`<div class="kv"><div><span>Bond</span><b>${esc(b.type)} · ${money(b.amount,c)}</b></div><div><span>Beneficiary</span><b>${esc(b.beneficiary)}</b></div><div><span>Insurer and route</span><b>${esc(b.insurer)} · ${esc(b.broker||'Direct')}</b></div><div><span>Quote</span><b>${b.quote?.rate}% · ${full(b.quote?.premium,c)} + GST</b></div><div><span>Period</span><b>${fd(b.start)} → ${fd(b.expiry)}</b></div><div><span>Approver</span><b>${esc(bandLabel(b))}</b></div></div>
   ${b.overLimit?'<div class="note w">Over the insurer\'s recorded line (flag only).</div>':''}
   ${okA?`${fld('Comment','<textarea id="apCm" placeholder="Optional for approval, required for rejection"></textarea>')}<div class="acts" style="margin-top:10px"><button class="btn p" data-a="approve">Approve</button><button class="btn d" data-a="reject">Reject and return to BU</button></div>`:`<p class="mu">${can('approve','approve')&&b.createdBy===me().id?'You raised this request, so someone else must approve it.':'Waiting for '+esc(bandLabel(b))+'.'}</p>`}`;
  return actPanel('Step 3 · Internal approval',body,'Owner: Approver')}
A.approve=()=>{const b=bond(ui.bond),cm=val('apCm');b.approval={status:'approved',at:now(),by:me().name,comment:cm,band:bandLabel(b)};(b.approvals=b.approvals||[]).push(b.approval);setStep(b,'placement');blog(b,'Approved'+(cm?': '+cm:'')+'.','Approval');save();render();toast('Approved. Next: PI, draft bond and payment.')};
A.reject=()=>{const b=bond(ui.bond),cm=val('apCm');if(!cm)return toast('Give a reason for rejecting.',1);b.approval={status:'rejected',at:now(),by:me().name,comment:cm,band:bandLabel(b)};(b.approvals=b.approvals||[]).push(b.approval);b.returned={kind:'reject',at:now(),by:me().name,comment:cm};setStep(b,'request');blog(b,'Rejected and returned to BU: '+cm+'.','Approval');save();render();toast('Returned to the BU with your comment.')};

/* Step 4 */
function stPlacement(b){const c=curOf(b),team=can('placement','edit'),fin=can('payment','edit'),mk=isMaker(b),pi=b.pi,v=piVar(b),gst=+S.settings.gst||18;
  const piForm=`<div class="note i">Reading the PI automatically (OCR) and the OMS link are Phase 2. Enter the figures from the PI here.</div><div class="grid">
    ${fld('PI number <span class="req">*</span>',`<input id="piNo" data-in="piCalc" value="${esc(pi?.no||'')}">`)}${fld('PI date',`<input type="date" id="piDate" data-in="piCalc" value="${esc(pi?.date||TODAY)}">`)}
    ${fld('Premium before GST <span class="req">*</span>',`<input type="number" id="piPrem" step="any" min="0" value="${esc(pi?.premium??b.quote?.premium??'')}" data-in="piCalc">`,'Quoted: '+full(b.quote?.premium,c))}
    ${fld('GST ('+gst+'%)',`<input type="number" id="piGst" step="any" min="0" value="${esc(pi?.gst??'')}" data-in="piCalc">`,'Filled at '+gst+'%; edit to match the PI')}
    ${fld('Stamp paper cost',`<input type="number" id="piStamp" step="any" min="0" value="${esc(pi?.stamp??'')}" data-in="piCalc">`,'Entered by hand')}
    ${fld('PI total',`<input id="piTot" readonly value="${pi?full(pi.total,c):''}">`)}</div>
    <label class="ck" style="margin-top:8px"><input type="checkbox" id="piGstin" data-in="piCalc" ${pi?.gstinOk?'checked':''}> PI shows the Zetwerk GSTIN (${esc(S.settings.gstin||'')})</label>
    <div class="acts" style="margin-top:10px"><button class="btn" data-a="piFile">${pi?.file?'Replace PI file':'Attach PI file'}</button>${ui.piFile||pi?.file?fileChip(ui.piFile||pi.file):''}<button class="btn p" data-a="piSave">Save PI</button>${pi?'<button class="btn" data-a="piCancel">Cancel</button>':''}</div><div id="piPrev" style="margin-top:14px"></div>`;
  const piView=pi?`<div class="kv"><div><span>PI</span><b>${esc(pi.no)} · ${fd(pi.date)}</b></div><div><span>Premium</span><b>${full(pi.premium,c)}</b></div><div><span>GST</span><b>${full(pi.gst,c)}</b></div><div><span>Stamp paper</span><b>${full(pi.stamp||0,c)}</b></div><div><span>Total</span><b>${full(pi.total,c)}</b></div><div><span>File</span><b>${fileChip(pi.file)}</b></div></div>
    <div class="note ${v.over?(pi.accepted?'i':'w'):'o'}">Quoted ${full(b.quote?.premium,c)} · PI ${full(pi.premium,c)} · difference ${full(v.diff,c)} (${v.pct.toFixed(2)}%), tolerance ${S.settings.premTol}%. ${v.over?(pi.accepted?'Variance accepted by '+esc(pi.accepted.by)+': '+esc(pi.accepted.reason):'Outside tolerance: Finance or the bond team must accept it before payment.'):'Within tolerance.'}${pi.gstinOk?'':' Zetwerk GSTIN not confirmed on the PI.'}</div>
    <div class="acts"><button class="btn sm" data-a="piPrevOpen">View PI</button>${team&&!b.payment?'<button class="btn sm" data-a="piEdit">Edit PI</button>':''}${v.over&&!pi.accepted&&(fin||team)?'<button class="btn sm p" data-a="piAccept">Accept variance</button>':''}</div>`:'';
  const a=subBox('a','Proforma invoice (PI) and premium check',pi&&(!v.over||pi.accepted)?'done':'cur',pi&&!ui.piEdit?piView:team?piForm:'<p class="mu">Bond team enters the PI.</p>');
  const d=b.draft||{};
  const bx=subBox('b','Draft bond and BU confirmation',d.confirmed?'done':'cur',`${d.file?`<div class="kv"><div><span>Draft bond</span><b>${fileChip(d.file)}</b></div><div><span>Uploaded</span><b>${fdt(d.file.at)} · ${esc(d.file.by)}</b></div>${d.confirmed?`<div><span>Confirmed by BU</span><b>${fdt(d.confirmed.at)} · ${esc(d.confirmed.by)}</b></div>`:''}</div>`:'<p class="mu" style="margin:0 0 8px">No draft bond uploaded yet.</p>'}
    ${d.changeReq?`<div class="note w">BU asked for changes: ${esc(d.changeReq.comment)} (${fdt(d.changeReq.at)})</div>`:''}
    <div class="acts">${team&&!d.confirmed?`<button class="btn ${d.file?'':'p'}" data-a="draftUp">${d.file?'Replace draft':'Upload draft bond'}</button>`:''}${mk&&d.file&&!d.confirmed&&!d.changeReq?'<button class="btn p" data-a="draftOk">Confirm draft wording</button><button class="btn" data-a="draftChg">Ask for changes</button>':''}</div>`);
  const pay=b.payment;
  const cx=subBox('c','Payment in OMS · UTR and bank details',pay?'done':pi&&(!v.over||pi.accepted)?'cur':'lock',pay?payView(b):fin?payForm(b):'<p class="mu">Finance records the payment.</p>');
  const ready=pi&&(!v.over||pi.accepted)&&d.confirmed&&pay;
  return actPanel('Step 4 · Placement and payment',a+bx+cx+(ready&&can('issue','edit')?'<button class="btn p" data-a="toIssue">Move to bond issuance</button>':''),'Owners: Bond team · BU · Finance')}
CH.piCalc=el=>{const p=+$('#piPrem').value||0;if(el.id==='piPrem')$('#piGst').value=Math.round(p*(+S.settings.gst||18))/100;const t=p+(+$('#piGst').value||0)+(+$('#piStamp').value||0);$('#piTot').value=full(t,curOf(bond(ui.bond)))};
A.piFile=async()=>{const f=await pickFiles(false);if(f[0]){ui.piFile=fileMeta(f[0]);render()}};
A.piEdit=()=>{ui.piEdit=true;render()};A.piCancel=()=>{ui.piEdit=false;ui.piFile=null;render()};
A.piSave=()=>{const b=bond(ui.bond),no=val('piNo'),p=num(val('piPrem'));if(!no||p==null)return toast('Enter the PI number and premium.',1);const g=num(val('piGst'))??Math.round(p*(+S.settings.gst||18))/100,st=num(val('piStamp'))||0;
  b.pi={no,date:val('piDate'),premium:p,gst:g,stamp:st,total:p+g+st,gstinOk:$('#piGstin').checked,file:ui.piFile||b.pi?.file||null,at:now(),by:me().name};ui.piEdit=false;ui.piFile=null;const v=piVar(b);
  blog(b,'PI '+no+' saved: '+full(b.pi.total,curOf(b))+' incl. GST and stamp paper. Variance '+v.pct.toFixed(2)+'%.');advance(b);save();render()};
A.piAccept=()=>confirmBox('Accept the premium variance?','The PI premium differs from the quote by more than the tolerance. Accepting lets Finance pay.','Accept variance',r=>{const b=bond(ui.bond);b.pi.accepted={at:now(),by:me().name,reason:r};blog(b,'Premium variance accepted: '+r+'.');save();render()},{reason:true});
A.draftUp=async()=>{const b=bond(ui.bond);const f=await pickFiles(false);if(!f[0])return;b.draft={file:fileMeta(f[0])};blog(b,'Draft bond uploaded: '+f[0].name+'. Waiting for BU to confirm the wording.');save();render()};
A.draftOk=()=>{const b=bond(ui.bond);b.draft.confirmed={at:now(),by:me().name};blog(b,'BU confirmed the draft bond wording.');advance(b);save();render()};
A.draftChg=()=>confirmBox('Ask for changes to the draft?','The bond team will get your comment and upload a revised draft.','Send',r=>{const b=bond(ui.bond);b.draft.changeReq={at:now(),by:me().name,comment:r};blog(b,'BU asked for draft changes: '+r+'.');save();render()},{reason:true,reasonLabel:'What needs to change'});
A.paySave=()=>{const b=bond(ui.bond),u=val('payUtr'),d=val('payDate');if(!u||!d)return toast('Enter the UTR and payment date.',1);b.payment={utr:u,date:d,amount:num(val('payAmt')),at:now(),by:me().name};blog(b,'Payment recorded from OMS: UTR '+u+' on '+fd(d)+'.','Payment');advance(b);save();render()};
function advance(b){if(b.step==='placement'&&b.pi&&(!piVar(b).over||b.pi.accepted)&&b.draft?.confirmed&&b.payment){setStep(b,'issue');blog(b,'Placement complete. Moved to bond issuance.')}}
A.toIssue=()=>{const b=bond(ui.bond);setStep(b,'issue');save();render()};

/* Step 5 */
function stIssue(b){if(!can('issue','edit'))return actPanel('Step 5 · Bond issued','<p class="mu">Waiting for the bond team to upload the final bond.</p>');const ch=b.kind!=='new'?(b.changes||{}):{};
  return actPanel('Step 5 · Bond issued',`<div class="note i">Upload the final ${b.kind==='new'?'bond':'endorsement'} and enter its details. Reading these from the PDF automatically is Phase 2.</div>
   <div class="grid">${fld(b.kind==='new'?'Bond number <span class="req">*</span>':'Endorsement number <span class="req">*</span>','<input id="fnNo">')}${fld('Insurer / policy reference','<input id="fnRef">')}
   ${fld('Start date',`<input type="date" id="fnStart" value="${esc(b.start||'')}">`)}${fld('Expiry date <span class="req">*</span>',`<input type="date" id="fnExp" value="${esc(ch.expiry||b.expiry||'')}">`)}${fld('Claim-expiry date',`<input type="date" id="fnClaim" value="${esc(ch.claim||b.claim||'')}">`)}</div>
   <div class="acts" style="margin-top:10px"><button class="btn" data-a="fnFile">${ui.fnFile?'Replace file':'Attach final '+(b.kind==='new'?'bond':'endorsement')+' <span class="req">*</span>'}</button>${ui.fnFile?fileChip(ui.fnFile):''}<button class="btn p" data-a="issueGo">Mark as issued</button></div>`,'Owner: Bond team')}
A.fnFile=async()=>{const f=await pickFiles(false);if(f[0]){ui.fnFile=fileMeta(f[0]);const v={no:val('fnNo'),ref:val('fnRef'),s:val('fnStart'),e:val('fnExp'),c:val('fnClaim')};render();$('#fnNo').value=v.no;$('#fnRef').value=v.ref;$('#fnStart').value=v.s;$('#fnExp').value=v.e;$('#fnClaim').value=v.c}};
A.issueGo=()=>{const b=bond(ui.bond),no=val('fnNo'),exp=val('fnExp');if(!ui.fnFile)return toast('Attach the final bond file.',1);if(!no||!exp)return toast('Enter the number and expiry date.',1);
  b.final={file:ui.fnFile,bondNo:no,insRef:val('fnRef'),start:val('fnStart'),expiry:exp,claim:val('fnClaim'),at:now(),by:me().name};ui.fnFile=null;
  if(b.kind==='new'){b.start=b.final.start||b.start;b.expiry=exp;b.claim=b.final.claim||b.claim;b.status='issued';b.version=1;b.versions=[{v:1,at:now(),by:me().name,change:'Bond issued · '+no,ref:b.ref}];b.reqStatus='Issued';
    const u=util(b.insurer);if(u.avail<0)b.overLimit=true;blog(b,'Bond issued: '+no+'. Limit utilised on '+b.insurer+'.','Issuance')}
  else{const p=bond(b.parentId),ch=b.changes||{},parts=[];
    if(p){if(exp&&exp!==p.expiry){parts.push('expiry '+fd(p.expiry)+' → '+fd(exp));p.expiry=exp}const cl=b.final.claim||ch.claim;if(cl&&cl!==p.claim){parts.push('claim expiry '+fd(p.claim)+' → '+fd(cl));p.claim=cl}
      if(ch.amount!=null&&+ch.amount!==+p.amount){parts.push('amount '+money(p.amount,curOf(p))+' → '+money(ch.amount,curOf(p)));p.amount=+ch.amount}if(ch.beneficiary&&ch.beneficiary!==p.beneficiary){parts.push('beneficiary changed');p.beneficiary=ch.beneficiary}if(ch.wording)parts.push('wording changed');
      p.version=(p.version||1)+1;(p.versions=p.versions||[]).push({v:p.version,at:now(),by:me().name,change:KIND_L[b.kind]+': '+(parts.join('; ')||'endorsed'),ref:b.ref});if(b.kind==='ext')p.reqStatus='Extended';
      blog(p,KIND_L[b.kind]+' endorsed ('+b.ref+'): '+(parts.join('; ')||'no field change')+'. Now V'+p.version+'.','Issuance')}
    b.status='issued';b.producedVersion=p?.version;blog(b,'Endorsement issued: '+no+'.','Issuance')}
  setStep(b,'closure');save();render();toast('Issued. Last step: upload the tax invoice.')};

/* Step 6 */
function stClosure(b){if(!can('issue','edit'))return actPanel('Step 6 · Closure','<p class="mu">Waiting for the bond team to upload the tax invoice.</p>');
  return actPanel('Step 6 · Closure · tax invoice',`<div class="grid">${fld('Tax invoice number <span class="req">*</span>','<input id="tiNo">')}${fld('Invoice date',`<input type="date" id="tiDate" value="${TODAY}">`)}${fld('Total amount',`<input type="number" id="tiAmt" step="any" value="${esc(b.pi?.total??'')}">`)}</div>
   <div class="acts" style="margin-top:10px"><button class="btn" data-a="tiFile">${ui.tiFile?'Replace file':'Attach tax invoice'}</button>${ui.tiFile?fileChip(ui.tiFile):''}<button class="btn p" data-a="closeGo">Close the request</button></div><p class="mu" style="margin:8px 0 0">After closure, expiry, claim-expiry and return are still tracked on the bond.</p>`,'Owner: Bond team')}
A.tiFile=async()=>{const f=await pickFiles(false);if(f[0]){const v=[val('tiNo'),val('tiDate'),val('tiAmt')];ui.tiFile=fileMeta(f[0]);render();$('#tiNo').value=v[0];$('#tiDate').value=v[1];$('#tiAmt').value=v[2]}};
A.closeGo=()=>{const b=bond(ui.bond),no=val('tiNo');if(!no||!ui.tiFile)return toast('Enter the invoice number and attach the tax invoice.',1);b.taxInv={no,date:val('tiDate'),amount:num(val('tiAmt')),file:ui.tiFile,at:now(),by:me().name};ui.tiFile=null;setStep(b,'done');b.closedAt=now();blog(b,'Tax invoice '+no+' uploaded. Request closed.','Closure');save();render();toast('Closed.')};

/* lifecycle of a live bond */
function stLife(b){const kids=S.bonds.filter(x=>x.parentId===b.id),inv=b.invocation,act=can('lifecycle','create')||can('issue','edit');const d=dBetween(TODAY,b.expiry);
  return actPanel('Live bond',`<div class="kv"><div><span>Bond number</span><b>${esc(b.final?.bondNo||'—')}</b></div><div><span>Insurer</span><b>${esc(b.insurer)} · ${esc(b.broker||'Direct')}</b></div><div><span>Expiry</span><b>${fd(b.expiry)}${d!=null?` <span class="mu">(${d<0?-d+' days ago':d+' days'})</span>`:''}</b></div><div><span>Claim expiry</span><b>${fd(b.claim)}</b></div><div><span>Version</span><b>V${b.version||1}</b></div></div>
   ${inv?`<div class="note ${inv.status==='closed'?'i':'e'}"><b>Invocation ${inv.status==='closed'?'closed':'open'}:</b> claimed ${full(inv.amount,curOf(b))} on ${fd(inv.date)} · ${esc(inv.reason)}${inv.status==='closed'?' · paid '+full(inv.paid,curOf(b))+' · '+esc(inv.disposition):''}</div>`:''}
   ${kids.length?`<p class="mu">Change requests: ${kids.map(k=>`<button class="btn link" data-a="openBond" data-id="${k.id}">${esc(k.ref||'Draft')}</button> (${esc(statusL(k)[0])})`).join(', ')}</p>`:''}
   ${act?`<div class="acts">${can('lifecycle','create')?'<button class="btn" data-a="raise" data-k="ext">Raise extension</button><button class="btn" data-a="raise" data-k="amd">Raise amendment</button>':''}${can('lifecycle','edit')||can('issue','edit')?`<button class="btn" data-a="relOpen">Record return / cancellation</button>${inv&&inv.status!=='closed'?'<button class="btn" data-a="invClose">Record invocation outcome</button>':'<button class="btn d" data-a="invOpen">Record invocation</button>'}<button class="btn" data-a="markExp">Mark expired</button>`:''}</div>`:''}`,'')}
A.raise=el=>{const p=bond(ui.bond),k=el.dataset.k;if(S.bonds.some(x=>x.parentId===p.id&&x.status==='open'&&x.kind===k))return toast('An '+KIND_L[k].toLowerCase()+' for this bond is already in progress.',1);
  const b=blankBond(k);Object.assign(b,{parentId:p.id,bu:p.bu,entity:p.entity,geography:p.geography,currency:curOf(p),cust:p.cust,beneficiary:p.beneficiary,benClass:p.benClass,project:p.project,tenderRef:p.tenderRef,type:p.type,amount:p.amount,start:p.start,expiry:p.expiry,claim:p.claim,period:{...p.period||{mode:'manual'}},
    changes:{expiry:p.expiry,claim:p.claim,amount:p.amount,beneficiary:p.beneficiary,wording:''},reqDocs:[{name:'Customer letter asking for the '+KIND_L[k].toLowerCase(),mandatory:true,owner:'BU',file:null,remark:''},{name:'Revised bond wording',mandatory:k==='amd',owner:'CSO',file:null,remark:''}]});
  ui.draft=b;ui.reqErr=null;XF.clear();go('request')};
A.relOpen=()=>{const b=bond(ui.bond);if(b.invocation&&b.invocation.status!=='closed')return toast('Record the invocation outcome before returning this bond.',1);ui.modal={kind:'rel'};
  modal(`<h2>Return or cancel ${esc(b.ref)}</h2><p class="lead">The limit on ${esc(b.insurer)} is restored automatically once this is recorded.</p><div class="grid">${fld('Type','<select id="rlType"><option>Returned</option><option>Cancelled</option></select>')}${fld('Effective date <span class="req">*</span>',`<input type="date" id="rlDate" value="${TODAY}">`)}${fld('Reason <span class="req">*</span>','<textarea id="rlWhy"></textarea>','','full')}</div>
  <label class="ck"><input type="checkbox" id="rlOrig"> Original bond copy received back</label><label class="ck"><input type="checkbox" id="rlDis"> Discharge letter received from the beneficiary</label><label class="ck"><input type="checkbox" id="rlIns"> Insurer has confirmed</label>
  <div class="acts" style="margin-top:8px"><button class="btn" data-a="rlFile">Attach documents</button><span id="rlFiles" class="mu">${(ui.rlFiles||[]).map(f=>esc(f.name)).join(', ')}</span></div>
  <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="relGo">Record</button></div>`)};
A.rlFile=async()=>{const f=await pickFiles(true);ui.rlFiles=f.map(x=>fileMeta(x));$('#rlFiles').textContent=ui.rlFiles.map(x=>x.name).join(', ')};

const mask=a=>{a=String(a||'').replace(/\s/g,'');return a?(a.length>4?'•••• '+a.slice(-4):a):'—'};
function inWords(n){const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'],b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];const t=x=>x<20?a[x]:b[x/10|0]+(x%10?' '+a[x%10]:''),h=x=>(x>99?a[x/100|0]+' Hundred'+(x%100?' ':''):'')+(x%100?t(x%100):'');let r=Math.round((+n||0)*100),p=r%100,i=(r-p)/100,s=[];[[1e7,'Crore'],[1e5,'Lakh'],[1e3,'Thousand']].forEach(([d,l])=>{const q=Math.floor(i/d);if(q){s.push(h(q)+' '+l);i%=d}});if(i)s.push(h(i));return 'Rupees '+(s.join(' ')||'Zero')+(p?' and '+t(p)+' Paise':'')+' Only'}

function adviceNo(b){return 'PA/'+(b.ref||'').replace(/^BND\//,'')}

/* minimal email (.eml) reader: splits a mail chain into its replies */
function decodeWords(s){return s.replace(/=\?([^?]+)\?([BQbq])\?([^?]*)\?=/g,(m,cs,enc,txt)=>{try{const bytes=enc.toUpperCase()==='B'?Uint8Array.from(atob(txt),c=>c.charCodeAt(0)):qpBytes(txt.replace(/_/g,' '));return new TextDecoder(cs).decode(bytes)}catch(e){return txt}})}
function qpBytes(s){s=s.replace(/=\r?\n/g,'');const out=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9A-Fa-f]{2}$/.test(s.substr(i+1,2))){out.push(parseInt(s.substr(i+1,2),16));i+=2}else{const c=s.charCodeAt(i);if(c<128)out.push(c);else out.push(...new TextEncoder().encode(s[i]))}}return new Uint8Array(out)}
function parsePart(raw){const i=raw.search(/\r?\n\r?\n/);const hraw=i<0?raw:raw.slice(0,i);const body=i<0?'':raw.slice(i).replace(/^\r?\n\r?\n/,'');
  const H={};hraw.replace(/\r?\n[ \t]+/g,' ').split(/\r?\n/).forEach(l=>{const m=l.match(/^([\w-]+):\s*(.*)$/);if(m)H[m[1].toLowerCase()]=m[2]});const ct=H['content-type']||'text/plain';
  if(/^multipart\//i.test(ct)){const bd=(ct.match(/boundary="?([^";]+)"?/i)||[])[1];if(!bd)return {H};const parts=body.split('--'+bd).slice(1).filter(p=>!/^--/.test(p));let plain=null,html=null;for(const p of parts){const r=parsePart(p.replace(/^\r?\n/,''));if(r.plain&&!plain)plain=r.plain;if(r.html&&!html)html=r.html}return {H,plain,html}}
  if(/^text\/(plain|html)/i.test(ct)&&!/attachment/i.test(H['content-disposition']||'')){const cs=(ct.match(/charset="?([\w-]+)"?/i)||[])[1]||'utf-8';const te=(H['content-transfer-encoding']||'').toLowerCase();let txt=body;try{if(te==='base64')txt=new TextDecoder(cs).decode(Uint8Array.from(atob(body.replace(/\s/g,'')),c=>c.charCodeAt(0)));else if(te==='quoted-printable')txt=new TextDecoder(cs).decode(qpBytes(body))}catch(e){}return /html/i.test(ct)?{H,html:txt}:{H,plain:txt}}

function parseQuotedDate(s){s=s.replace(/\s+/g,' ').replace('Sept','Sep').replace(' at ',' ');let m=s.match(/(\w{3}) (\d{1,2}), (\d{4}),? (\d{1,2}):(\d{2}) ?([AaPp][Mm])/),M,D,Y,h,mi,ap;
  if(m){[,M,D,Y,h,mi,ap]=m}else{m=s.match(/(\d{1,2}) (\w{3}),? (\d{4}),? (\d{1,2}):(\d{2}) ?([AaPp][Mm])/);if(!m)return null;[,D,M,Y,h,mi,ap]=m}
  const mo=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].indexOf(M.toLowerCase().slice(0,3));if(mo<0)return null;h=+h%12+(/p/i.test(ap)?12:0);return `${Y}-${pad(mo+1)}-${pad(D)}T${pad(h)}:${mi}:00`}

  let text=r.plain||(r.html||'').replace(/<style[\s\S]*?<\/style>/gi,'').replace(/<br\s*\/?>/gi,'\n').replace(/<\/(p|div)>/gi,'\n').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>');text=text.replace(/^[> ]+/gm,'');

  hits.forEach((h,k)=>{const end=k+1<hits.length?hits[k+1].index:text.length;const dt=parseQuotedDate(h[1]);if(dt)msgs.push({fromName:h[2].replace(/\s+/g,' ').trim()||h[3],from_:h[3],date:dt,body:cleanBody(text.slice(h.index+h[0].length,end))})});
  let added=0;b.mails=b.mails||[];msgs.forEach(m=>{if(!m.body)return;if(b.mails.some(x=>x.from_.toLowerCase()===m.from_.toLowerCase()&&x.date.slice(0,16)===m.date.slice(0,16)))return;b.mails.push({id:uid('m'),thread:subj,...m});added++});
  if(added)blog(b,'Imported '+added+' mail(s) from “'+subj+'”.','Communication');return added}

<script>
/* ============ match uploaded files to checklist documents (names do not need to match) ============ */
async function mapFiles(title,slots,files,only,onDone){
  const cands=[];
  for(const f of files){
    if(isZip(f)){try{const z=await JSZip.loadAsync(f);z.forEach((p,e)=>{if(!e.dir&&!/(^|\/)(__MACOSX|\.DS_Store)/.test(p))cands.push({name:p.split('/').pop(),label:p.split('/').pop()+'  (in '+f.name+')',from:f.name,get:()=>z.file(p).async('blob')})})}catch(e){toast('Could not open '+f.name,1)}
      cands.push({name:f.name,label:f.name+'  (whole zip)',whole:true,get:async()=>f})}
    else cands.push({name:f.name,label:f.name,get:async()=>f})}
  if(!cands.length)return;
  const targets=slots.map((s,i)=>({s,i})).filter(x=>!only||only.includes(x.s.name)),used=new Set(),pick={};
  targets.forEach(({s,i})=>{const k=cands.findIndex((c,j)=>!used.has(j)&&!c.whole&&matchDoc(s.name,[c.name]).length);if(k>=0){pick[i]=k;used.add(k)}});
  targets.forEach(({s,i})=>{if(pick[i]!=null||s.file)return;const k=cands.findIndex((c,j)=>!used.has(j)&&!c.whole);if(k>=0){pick[i]=k;used.add(k)}});
  ui.modal={kind:'map',slots,cands,targets,onDone};
  modal(`<h2>${esc(title)}</h2><p class="lead">Pick which file is which document. File names do not need to match; names that look right are pre-selected and the rest are filled in order. Check each row, then attach.</p>
  ${tbl('<th>Document</th><th>Current</th><th>File to attach</th>',targets.map(({s,i})=>`<tr><td><b>${esc(s.name)}</b></td><td>${s.file?esc(s.file.name):'<span class="mu">None</span>'}</td><td style="min-width:260px"><select id="mp_${i}"><option value="">— ${s.file?'Keep current':'Leave empty'} —</option>${cands.map((c,j)=>`<option value="${j}" ${pick[i]===j?'selected':''}>${esc(c.label)}</option>`).join('')}</select></td></tr>`).join(''))}
  <p class="mu" style="margin:8px 0 0">${cands.length} file(s) uploaded. Files not picked for any document are not attached.</p>
  <div class="foot"><button class="btn" data-a="closeModal">Cancel</button><button class="btn p" data-a="mapGo">Attach files</button></div>`,true)}
A.mapGo=async()=>{const m=ui.modal,hits=[];for(const {s,i} of m.targets){const v=$('#mp_'+i)?.value;if(v==='')continue;const c=m.cands[+v],bl=await c.get(),id=uid('f');FDB.put(id,bl);s.file={id,name:c.whole?c.name:c.name,from:c.from||'',size:bl.size,type:bl.type||'',at:now(),by:me().name};s.remark='';hits.push(s.name)}
  closeModal();m.onDone(hits)};
A.packUp=async()=>{const b=ui.draft;if(!b.reqDocs.length)return toast('Choose the bond type first. The document list depends on it.',1);const f=await pickFiles(true);if(!f.length)return;
  mapFiles('Match files to documents',b.reqDocs,f,null,hits=>{keepDraft(b);render();toast(hits.length?'Attached: '+hits.join(', ')+'.':'Nothing attached.')})};
A.packZip=async()=>{const b=bond(ui.bond);const f=await pickFiles(true);if(!f.length)return;const r=openReq(b,'insurer');const only=r&&!r.submittedAt&&!can('verify','edit')?r.docs:null;
  mapFiles('Match files to insurer pack documents',b.insDocs,f,only,hits=>{if(r&&!r.submittedAt)hits.filter(n=>r.docs.includes(n)).forEach(n=>r.responses.push({doc:n,file:(b.insDocs.find(d=>d.name===n).file||{}).name,at:now(),by:me().name}));
    if(hits.length)blog(b,'Insurer pack upload: '+hits.join(', ')+'.');save();render();toast(hits.length?'Attached: '+hits.join(', ')+'.':'Nothing attached.')})};
</script>
<script>
/* ============ Masters (New / Edit / Delete, newest on top) ============ */
const typesL=()=>MA('bondTypes').map(t=>t.name);
const MDEF={
 entities:{l:'Legal entities',d:'Companies that take bonds. Currency and geography fill into requests.',f:[['name','Legal name','text',1],['code','Entity code','text',1],['currency','Currency','sel',1,()=>MA('currencies').map(c=>c.code)],['geography','Geography','sel',0,()=>MA('geos').map(g=>g.name)],['parent','Parent entity','sel',0,()=>MA('entities').map(e=>e.name)]],
   used:r=>S.bonds.filter(b=>b.entity===r.name).length+M('bus').filter(x=>x.entity===r.name).length},
 bus:{l:'Business units',d:'BUs that raise requests, with their BU Finance point of contact.',f:[['name','Business unit','text',1],['finName','BU Finance POC','text'],['finEmail','BU Finance email','text'],['entity','Default legal entity','sel',0,()=>MA('entities').map(e=>e.name)]],
   used:r=>S.bonds.filter(b=>b.bu===r.name).length+ACCESS.users.filter(u=>u.bu===r.name).length},
 insurers:{l:'Insurers',d:'Surety insurers with their sanctioned line, the bond types they take and their brokers.',f:[['name','Insurer','text',1],['kind','Market','sel',1,()=>['Domestic','International']],['currency','Line currency','sel',1,()=>MA('currencies').map(c=>c.code)],['limit','Sanctioned line (Cr for INR, M for USD)','num',1],['types','Bond types taken (blank = all)','multi',0,typesL],['brokers','Brokers','multi',0,()=>MA('brokers').map(b=>b.name)],['underwriter','Underwriter','text'],['reinsurer','Reinsurer','text'],['status','Relationship status','text'],['gstin','Insurer GSTIN','text'],['payee','Payee name (for premium payment)','text'],['payBank','Payee bank','text'],['payAcc','Payee account number','text'],['payIfsc','Payee IFSC','text']],
   used:r=>S.bonds.filter(b=>b.insurer===r.name).length+M('insDocs').filter(d=>d.insurer===r.name).length},
 brokers:{l:'Brokers',d:'A broker can place with several insurers. Direct is always available as a route.',f:[['name','Broker','text',1],['contact','Contact person','text'],['email','Email','text'],['phone','Phone','text']],
   used:r=>S.bonds.filter(b=>b.broker===r.name).length+M('insurers').filter(i=>(i.brokers||[]).includes(r.name)).length},
 bondTypes:{l:'Bond types',d:'Bid-period calculator on = start is the bid submission date and expiry is calculated.',f:[['name','Bond type','text',1],['code','Code','text',1],['group','Group','sel',1,()=>Object.entries(GROUPS)],['pctMin','Usual % of contract · from','num'],['pctMax','Usual % of contract · to','num'],['claimDays','Default claim period (days)','num'],['calc','Bid-period calculator','bool'],['desc','Description','text']],
   used:r=>S.bonds.filter(b=>b.type===r.name).length+M('reqDocs').filter(d=>d.bondType===r.name).length},
 reqDocs:{l:'Request document checklist',d:'Documents the BU uploads at Step 1, per bond type. Each one is uploaded or explained in a remark.',f:[['bondType','Bond type','sel',1,()=>['All bond types',...typesL()]],['name','Document','text',1],['mandatory','Mandatory','bool'],['owner','Provided by','text'],['note','Note','text']],used:()=>0},
 insDocs:{l:'Insurer document pack',d:'Documents each insurer asks for. They become the pack checklist once the insurer is selected.',f:[['insurer','Insurer','sel',1,()=>MA('insurers').map(i=>i.name)],['name','Document','text',1],['owner','Provided by','text'],['note','Note','text']],used:()=>0},
 projStatus:{l:'Project status',d:'Shown on the request form. Limit a status to some bond types to make the dropdown depend on the type.',f:[['name','Project status','text',1],['types','Applies to bond types (blank = all)','multi',0,typesL],['pct','Asks for % completion','bool']],used:r=>S.bonds.filter(b=>b.projectStatus===r.name).length},
 reqStatus:{l:'Bond requirement status',d:'Kept separate from project status; the two do not move together.',f:[['name','Requirement status','text',1],['types','Applies to bond types (blank = all)','multi',0,typesL]],used:r=>S.bonds.filter(b=>b.reqStatus===r.name).length},
 currencies:{l:'Currencies',d:'No FX conversion: each currency is reported on its own.',f:[['code','Code','text',1],['name','Name','text',1],['symbol','Symbol','text',1],['unit','Reporting unit','text',1],['unitVal','Value of one unit','num',1],['locale','Number format (locale)','text']],used:r=>M('entities').filter(e=>e.currency===r.code).length+M('insurers').filter(i=>i.currency===r.code).length},
 geos:{l:'Geographies',d:'Countries or regions for entities and requests.',f:[['name','Geography','text',1]],used:r=>M('entities').filter(e=>e.geography===r.name).length+S.bonds.filter(b=>b.geography===r.name).length},
 banks:{l:'Our bank accounts',d:'Zetwerk accounts premiums are paid from. Picked on the payment step and printed on the payment advice.',f:[['account','Account number','text',1],['bank','Bank','text',1],['branch','Branch','text'],['ifsc','IFSC','text'],['entity','Legal entity (blank = any)','sel',0,()=>MA('entities').map(e=>e.name)]],used:r=>S.bonds.filter(b=>b.payment?.from?.account===r.account).length},
 stamp:{l:'Stamp duty by state',d:'Stamp paper values per state. Values pending from the team.',f:[['state','State','text',1],['bond','Bond stamp (₹)','num'],['indemnity','Indemnity stamp (₹)','num'],['notes','Notes','text']],used:()=>0}};
const keyOf=k=>MDEF[k].f[0][0];
const mShow=(f,v)=>f[2]==='bool'?(v?'Yes':'No'):f[2]==='multi'?(v||[]).join(', '):f[2]==='sel'&&f[0]==='group'?GROUPS[v]||v:v??'';
VIEWS.masters=()=>{const k=ui.mst,D=MDEF[k],cm=can('masters','create'),em=can('masters','edit'),dm=can('masters','delete');
  const T=TBL['m_'+k]={key:'m_'+k,cols:[...D.f.map(f=>({k:f[0],l:f[1].replace(/ \(.*\)$/,''),g:r=>mShow(f,r[f[0]]),n:f[2]==='num'?1:0})),{k:'_a',l:'Status',g:r=>r.active===false?'Inactive':'Active'},{k:'_c',l:'Created on',g:r=>(r.createdAt||'').slice(0,10),d:1},{k:'_b',l:'Created by',g:r=>r.createdBy||''}],
    rows:()=>M(k).map((r,i)=>({r,i})).sort((a,b)=>(b.r.createdAt||'').localeCompare(a.r.createdAt||'')||b.i-a.i).map(x=>x.r)};
  const rows=ftRows(T);
  return `<div class="chips">${Object.entries(MDEF).map(([x,d])=>`<button class="chip ${x===k?'on':''}" data-a="mstGo" data-k="${x}">${d.l}<span class="n">${M(x).length}</span></button>`).join('')}</div>
  <div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:8px"><div><h2>${esc(D.l)}</h2><span class="mu">${esc(D.d)}</span></div>${cm?`<button class="btn p" data-a="mNew">New ${esc(D.l.replace(/s$/,'').toLowerCase())}</button>`:''}</div>
  ${ftBar(T,'Search '+D.l.toLowerCase())}
  <div class="tw"><table><thead><tr>${ftHead(T)}<th class="stk"></th></tr></thead><tbody>${rows.map(r=>`<tr${r.active===false?' style="opacity:.6"':''}>${T.cols.map(c=>c.k==='_a'?`<td>${r.active===false?pill('Inactive','gr'):pill('Active','ok')}</td>`:c.k==='_c'?`<td class="w">${fdt(r.createdAt)}</td>`:`<td class="${c.n?'n':''}">${esc(c.g(r))}</td>`).join('')}
    <td class="stk"><div class="acts" style="flex-wrap:nowrap">${em?`<button class="btn sm" data-a="mEdit" data-id="${r.id}">Edit</button>`:''}${dm?`<button class="btn sm d" data-a="mDel" data-id="${r.id}">Delete</button>`:''}</div></td></tr>`).join('')||`<tr><td colspan="30" class="empty">${M(k).length?'Nothing matches these filters.':'No entries yet.'+(cm?' Use New to add the first one.':'')}</td></tr>`}</tbody></table></div></div>`};
A.mstGo=el=>{ui.mst=el.dataset.k;render()};
function mForm(rec){const k=ui.mst,D=MDEF[k],used=rec?D.used(rec):0;ui.modal={kind:'m',id:rec?.id||null};
  modal(`<h2>${rec?'Edit':'New'} · ${esc(D.l)}</h2><p class="lead">${esc(D.d)}</p><div class="grid g2">${D.f.map(([fk,l,t,req,o],i)=>{const v=rec?rec[fk]:(t==='bool'?(fk==='mandatory'):'');const id='mf_'+fk,lab=esc(l)+(req?' <span class="req">*</span>':''),lockKey=i===0&&rec&&used;
    if(t==='bool')return `<div class="fld"><label>&nbsp;</label><label class="toggle"><input type="checkbox" id="${id}" ${v?'checked':''}> ${esc(l)}</label></div>`;
    if(t==='sel')return fld(lab,`<select id="${id}">${opts(o(),v,'Choose')}</select>`);
    if(t==='multi')return fld(lab,`<div class="fl" id="${id}" style="max-height:140px">${o().map(x=>`<label class="ck"><input type="checkbox" value="${esc(x)}" ${(v||[]).includes(x)?'checked':''}> ${esc(x)}</label>`).join('')||'<span class="mu">Nothing to pick yet</span>'}</div>`,'','full');
    return fld(lab,`<input id="${id}" type="${t==='num'?'number':'text'}" ${t==='num'?'step="any"':''} value="${esc(v??'')}" ${lockKey?'readonly':''}>`,lockKey?'Used by '+used+' record(s), so it cannot be renamed. Make it inactive and create a new one instead.':'')}).join('')}
   ${rec?`<div class="fld"><label>&nbsp;</label><label class="toggle"><input type="checkbox" id="mf__active" ${rec.active!==false?'checked':''}> Active</label></div>`:''}</div>
   <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="mSave">${rec?'Save changes':'Create'}</button></div>`,true)}
A.mNew=()=>mForm(null);A.mEdit=el=>mForm(M(ui.mst).find(r=>r.id===el.dataset.id));
A.mSave=()=>{const k=ui.mst,D=MDEF[k],o={},miss=[];D.f.forEach(([fk,l,t,req])=>{let v;const el=document.getElementById('mf_'+fk);if(t==='bool')v=el.checked;else if(t==='multi')v=$$('input:checked',el).map(x=>x.value);else if(t==='num')v=num(el.value);else v=el.value.trim();o[fk]=v;if(req&&(v===''||v==null))miss.push(l)});
  if(miss.length)return toast('Fill: '+miss.join(', '),1);
  const key=keyOf(k),id=ui.modal.id,dup=M(k).find(r=>r.id!==id&&String(r[key]).toLowerCase()===String(o[key]).toLowerCase()&&(k!=='reqDocs'||r.bondType===o.bondType)&&(k!=='insDocs'||r.insurer===o.insurer));
  if(dup)return toast(o[key]+' already exists.',1);
  if(id){const r=M(k).find(x=>x.id===id),ch=D.f.filter(([fk])=>canon(r[fk])!==canon(o[fk])).map(([,l])=>l);Object.assign(r,o,{active:$('#mf__active').checked,modAt:now(),modBy:me().name});audit('Masters','Edited '+D.l,o[key],ch.join(', ')||'Status')}
  else{S.m[k]=S.m[k]||[];S.m[k].push({id:uid('m'),...o,active:true,createdAt:now(),createdBy:me().name});audit('Masters','Created '+D.l,o[key],'')}
  closeModal();save();render();toast(id?'Saved.':'Created. It is at the top of the list.')};
A.mDel=el=>{const k=ui.mst,D=MDEF[k],r=M(k).find(x=>x.id===el.dataset.id),n=D.used(r),name=r[keyOf(k)];
  if(n)return confirmBox('Cannot delete '+esc(name),`It is used by ${n} record(s). You can make it inactive so it no longer appears in dropdowns.`,'Make inactive',()=>{r.active=false;audit('Masters','Made inactive · '+D.l,name,'In use, not deleted');save();render()});
  confirmBox('Delete '+esc(name)+'?','This removes it from '+esc(D.l)+'. It is not used anywhere.','Delete',()=>{S.m[k]=M(k).filter(x=>x!==r);audit('Masters','Deleted '+D.l,name,'');save();render();toast('Deleted.')},{danger:true})};

/* ============ Users and roles ============ */
VIEWS.users=()=>{const tab=ui.utab||'users',cU=can('users','create'),eU=can('users','edit'),dU=can('users','delete');
  const tabs=`<div class="chips"><button class="chip ${tab==='users'?'on':''}" data-a="uTab" data-t="users">Users<span class="n">${ACCESS.users.length}</span></button><button class="chip ${tab==='roles'?'on':''}" data-a="uTab" data-t="roles">Roles and permissions<span class="n">${ACCESS.roles.length}</span></button></div>`;
  if(tab==='roles')return tabs+`<div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:8px"><div><h2>Roles</h2><span class="mu">A user can hold several roles; they get everything any of their roles allows. Super Admin always has every permission.</span></div>${cU?'<button class="btn p" data-a="rNew">New role</button>':''}</div>
   ${tbl('<th>Role</th><th>What it is for</th><th>Screens</th><th class="n">Users</th><th></th>',ACCESS.roles.map(r=>`<tr><td><b>${esc(r.name)}</b>${r.sa?' '+pill('All access','ac'):r.std?' '+pill('Standard','gr'):''}</td><td>${esc(r.desc||'')}</td><td class="mu">${r.sa?'Everything':SCR.filter(([k])=>(r.perms[k]||[]).length).map(([,l])=>l).join(', ')}</td><td class="n">${ACCESS.users.filter(u=>hasRole(u,r.id)).length}</td><td><div class="acts" style="flex-wrap:nowrap">${eU&&!r.sa?`<button class="btn sm" data-a="rEdit" data-id="${r.id}">Edit</button>`:''}${dU&&!r.std?`<button class="btn sm d" data-a="rDel" data-id="${r.id}">Delete</button>`:''}</div></td></tr>`).join(''))}</div>`;
  const T=TBL.users={key:'users',cols:[{k:'n',l:'Name',g:u=>u.name},{k:'e',l:'Email',g:u=>u.email||''},{k:'r',l:'Roles',g:u=>roleOf(u).name},{k:'b',l:'BU',g:u=>u.bu||''},{k:'l',l:'Sign-in',g:u=>u.uid?'Linked to claude.ai account':u.demo?'Demo user':'Not linked'},{k:'a',l:'Status',g:u=>u.active===false?'Inactive':'Active'},{k:'c',l:'Created on',g:u=>(u.createdAt||'').slice(0,10),d:1}],
    rows:()=>ACCESS.users.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''))};
  const rows=ftRows(T);
  return tabs+`<div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:8px"><div><h2>Users</h2><span class="mu">Link a user to a claude.ai account so that person signs in as them. ${canSwitch()?'You can switch to any user from “Signed in as” to test each role.':''}</span></div>${cU?'<button class="btn p" data-a="uNew">New user</button>':''}</div>
   ${ftBar(T,'Search users')}<div class="tw"><table><thead><tr>${ftHead(T)}<th class="stk"></th></tr></thead><tbody>${rows.map(u=>`<tr${u.active===false?' style="opacity:.6"':''}><td><b>${esc(u.name)}</b>${u.uid&&u.uid===ME.id?' '+pill('You','ac'):''}</td><td>${esc(u.email||'')}</td><td>${esc(roleOf(u).name)}</td><td>${esc(u.bu||'')}</td><td>${u.uid?pill('Linked','ok'):u.demo?pill('Demo','wa'):pill('Not linked','gr')}</td><td>${u.active===false?pill('Inactive','gr'):pill('Active','ok')}</td><td class="w">${fd(u.createdAt)}</td>
   <td class="stk"><div class="acts" style="flex-wrap:nowrap">${eU?`<button class="btn sm" data-a="uEdit" data-id="${u.id}">Edit</button>`:''}${dU?`<button class="btn sm d" data-a="uDel" data-id="${u.id}">Delete</button>`:''}</div></td></tr>`).join('')||'<tr><td colspan="9" class="empty">No users match.</td></tr>'}</tbody></table></div></div>`};
A.uTab=el=>{ui.utab=el.dataset.t;render()};
function uForm(u){ui.modal={kind:'u',id:u?.id||null,link:u?.uid||null,linkName:u?.uid?(NAMES[u.uid]||u.name):''};
  modal(`<h2>${u?'Edit user':'New user'}</h2><div class="grid g2">${fld('Name <span class="req">*</span>',`<input id="uName" value="${esc(u?.name||'')}">`)}${fld('Email',`<input id="uMail" type="email" value="${esc(u?.email||'')}">`)}
   ${fld('Business unit','<select id="uBu">'+opts(MA('bus').map(b=>b.name),u?.bu,'Any / not BU')+'</select>','For makers: their requests default to this BU.')}
   <div class="fld"><label>&nbsp;</label><label class="toggle"><input type="checkbox" id="uAct" ${u?.active!==false?'checked':''}> Active</label></div>
   ${fld('Roles <span class="req">*</span>',`<div class="fl" id="uRoles" style="max-height:200px">${ACCESS.roles.map(r=>`<label class="ck"><input type="checkbox" value="${r.id}" ${u&&hasRole(u,r.id)?'checked':''} ${r.sa&&!isSA()?'disabled':''}> <b>${esc(r.name)}</b> <span class="mu">${esc(r.desc||'')}</span></label>`).join('')}</div>`,'','full')}
   ${fld('claude.ai account','<div id="uLinkBox"></div>',MODE==='shared'?'Search people in your organisation and link one. They then sign in as this user.':'Linking works when the page is opened from claude.ai with shared data.','full')}</div>
   <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="uSave">${u?'Save':'Create user'}</button></div>`);uLinkRender()}
function uLinkRender(){const m=ui.modal,box=$('#uLinkBox');if(!box)return;
  if(m.link){box.innerHTML=`<div class="row c">${pill('Linked','ok')} <b>${esc(m.linkName||'Account')}</b><button class="btn sm" data-a="uUnlink">Unlink</button></div>`;return}
  if(MODE!=='shared'||!USERCAP){box.innerHTML='<span class="mu">Not linked</span>';return}
  box.innerHTML='<input id="uSearch" placeholder="Type a name to search" autocomplete="off"><div id="uHits" class="fl" style="max-height:150px"></div>';
  const s=$('#uSearch'),show=async q=>{let hits=[];try{hits=await USERCAP.search(q)}catch(e){}const h=$('#uHits');if(!h)return;h.innerHTML='';hits.filter(x=>!ACCESS.users.some(u=>u.uid===x.id&&u.id!==m.id)).slice(0,12).forEach(x=>{const b=document.createElement('button');b.type='button';b.className='btn sm';b.style.margin='3px';b.textContent=(x.name||'Unnamed')+(x.guest?' (guest)':'');b.onclick=()=>{m.link=x.id;m.linkName=x.name||'';NAMES[x.id]=x.name||'';if(!val('uName'))$('#uName').value=x.name||'';uLinkRender()};h.appendChild(b)});if(!h.children.length)h.innerHTML='<span class="mu">No match</span>'};
  s.addEventListener('focus',()=>show(''));s.addEventListener('input',()=>show(s.value))}
A.uUnlink=()=>{ui.modal.link=null;ui.modal.linkName='';uLinkRender()};
A.uNew=()=>uForm(null);A.uEdit=el=>uForm(U(el.dataset.id));
A.uSave=()=>{const m=ui.modal,name=val('uName'),roles=$$('#uRoles input:checked').map(x=>x.value);if(!name)return toast('Enter a name.',1);if(!roles.length)return toast('Give the user at least one role.',1);
  if(m.link&&IS_OWNER&&m.link===ME.id&&!roles.includes('r_sa'))roles.push('r_sa');
  const o={name,email:val('uMail'),bu:val('uBu'),active:$('#uAct').checked,roles,uid:m.link||null};
  if(m.id){const u=U(m.id),old=roleOf(u).name;Object.assign(u,o,{modAt:now(),modBy:me().name});audit('Users','Edited user',name,'Roles: '+old+' → '+roleOf(u).name+(o.uid?' · linked':''))}
  else{ACCESS.users.push({id:uid('usr_'),...o,createdAt:now(),createdBy:me().name});audit('Users','Created user',name,'Roles: '+roles.map(r=>ACCESS.roles.find(x=>x.id===r)?.name).join(', '))}
  closeModal();save();render();toast(m.id?'User saved.':'User created.')};
A.uDel=el=>{const u=U(el.dataset.id);if(u.uid&&u.uid===ME.id)return toast('You cannot delete your own user.',1);if(u.id===me().id)return toast('Switch to another user before deleting this one.',1);
  const n=S.bonds.filter(b=>b.createdBy===u.id).length;if(n)return confirmBox('Cannot delete '+esc(u.name),'This user raised '+n+' request(s). Make them inactive instead so they can no longer sign in.','Make inactive',()=>{u.active=false;audit('Users','Made inactive',u.name,'Has requests');save();render()});
  confirmBox('Delete '+esc(u.name)+'?','They will no longer be able to sign in to Bond Desk.','Delete user',()=>{ACCESS.users=ACCESS.users.filter(x=>x!==u);audit('Users','Deleted user',u.name,'');save();render()},{danger:true})};
function rForm(r){ui.modal={kind:'r',id:r?.id||null};const P=r?.perms||{};
  modal(`<h2>${r?'Edit role':'New role'}</h2><div class="grid g2">${fld('Role name <span class="req">*</span>',`<input id="rName" value="${esc(r?.name||'')}">`)}${fld('What it is for',`<input id="rDesc" value="${esc(r?.desc||'')}">`)}</div>
  <h3 style="margin-top:14px">Permissions</h3><div class="tw"><table class="perm"><thead><tr><th>Screen</th>${ACTS.map(a=>`<th>${ACT_L[a]}</th>`).join('')}</tr></thead><tbody>${SCR.map(([k,l,acts])=>`<tr><td>${esc(l)}</td>${ACTS.map(a=>`<td>${acts.includes(a)?`<input type="checkbox" data-pk="${k}" data-pa="${a}" ${(P[k]||[]).includes(a)?'checked':''} aria-label="${esc(l)} ${ACT_L[a]}">`:''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="rSave">${r?'Save role':'Create role'}</button></div>`,true)}
A.rNew=()=>rForm(null);A.rEdit=el=>rForm(ACCESS.roles.find(r=>r.id===el.dataset.id));
A.rSave=()=>{const n=val('rName');if(!n)return toast('Enter a role name.',1);const perms={};SCR.forEach(([k])=>perms[k]=[]);$$('[data-pk]:checked').forEach(c=>perms[c.dataset.pk].push(c.dataset.pa));
  if(ACCESS.roles.some(r=>r.id!==ui.modal.id&&r.name.toLowerCase()===n.toLowerCase()))return toast('A role with that name exists.',1);
  if(ui.modal.id){const r=ACCESS.roles.find(x=>x.id===ui.modal.id);Object.assign(r,{name:n,desc:val('rDesc'),perms});audit('Users','Edited role',n,'')}else{ACCESS.roles.push({id:uid('r_'),name:n,desc:val('rDesc'),perms});audit('Users','Created role',n,'')}
  closeModal();save();render()};
A.rDel=el=>{const r=ACCESS.roles.find(x=>x.id===el.dataset.id),n=ACCESS.users.filter(u=>hasRole(u,r.id)).length;if(n)return toast(n+' user(s) hold this role. Remove it from them first.',1);
  confirmBox('Delete role '+esc(r.name)+'?','No user holds it.','Delete role',()=>{ACCESS.roles=ACCESS.roles.filter(x=>x!==r);audit('Users','Deleted role',r.name,'');save();render()},{danger:true})};

/* ============ Settings ============ */
VIEWS.settings=()=>{const st=S.settings,ed=can('settings','edit'),dis=ed?'':'disabled',sla=st.sla||SET_DEF.sla;
  return `<div class="panel"><h2>Features</h2>
   <div class="setrow"><div><b>Read documents with Claude (OCR)</b><div class="mu">When on, the New request page can read a tender PDF, image or zip and fill the form. Reading the PI and the final bond is Phase 2.</div></div><label class="toggle"><input type="checkbox" id="sOcr" data-ch="sTog" data-k="ocr" ${st.ocr?'checked':''} ${dis}> <span>${st.ocr?'On':'Off'}</span></label></div>
   <div class="setrow"><div><b>SLA tracking</b><div class="mu">When on, requests that sit at a step longer than the days you set are flagged as overdue.</div></div><label class="toggle"><input type="checkbox" id="sSla" data-ch="sTog" data-k="sla" ${sla.on?'checked':''} ${dis}> <span>${sla.on?'On':'Off'}</span></label></div>
   ${sla.on?`<div class="grid" style="padding:4px 0 14px">${STEPS.slice(1).map(s=>fld('Step '+(stepIx(s.k)+1)+' · '+esc(s.l)+' (days)',`<input type="number" min="0" id="sl_${s.k}" data-ch="sSla" data-k="${s.k}" value="${esc(sla.days?.[s.k]??'')}" ${dis}>`)).join('')}</div>`:''}
   <div class="setrow"><div><b>Premium check (quoted premium vs PI)</b><div class="mu">When the insurer’s PI is entered at Step 4, Bond Desk compares its premium with the quote from Step 2. If they differ by more than the tolerance, Finance or the bond team must accept the variance before payment. GST % pre-fills the GST on the PI form, and the Zetwerk GSTIN is printed on the PI preview so you can check the insurer used it.</div></div><div class="grid" style="min-width:min(100%,520px)">${fld('Tolerance (%)',`<input type="number" step="any" min="0" id="sTol" data-ch="sNum" data-k="premTol" value="${esc(st.premTol)}" ${dis}>`)}${fld('GST (%)',`<input type="number" step="any" min="0" id="sGst" data-ch="sNum" data-k="gst" value="${esc(st.gst)}" ${dis}>`)}${fld('Zetwerk GSTIN on PI',`<input id="sGstin" data-ch="sTxt" data-k="gstin" value="${esc(st.gstin||'')}" ${dis}>`)}</div></div>
   <div class="setrow"><div><b>Expiry warning</b><div class="mu">Live bonds expiring within this many days show on the overview.</div></div><div style="width:160px">${fld('Days',`<input type="number" min="1" id="sExp" data-ch="sNum" data-k="expiryWarn" value="${esc(st.expiryWarn)}" ${dis}>`)}</div></div></div>
  <div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:8px"><div><h2>Approval matrix · Step 3</h2><span class="mu">The first band that matches the request's currency and amount decides who approves. CFO approver and final bands are still to be confirmed.</span></div>${ed?'<button class="btn p" data-a="apNew">New band</button>':''}</div>
   ${tbl('<th>Currency</th><th class="n">From</th><th class="n">Up to</th><th>Approver role</th><th>Label</th><th></th>',(st.approval||[]).map(r=>`<tr><td>${esc(r.currency||'INR')}</td><td class="n">${esc(r.min??0)} ${esc(CUR(r.currency).unit)}</td><td class="n">${r.max==null||r.max===''?'No limit':esc(r.max)+' '+esc(CUR(r.currency).unit)}</td><td>${esc(ACCESS.roles.find(x=>x.id===r.role)?.name||'—')}</td><td>${esc(r.label||'')}</td><td><div class="acts" style="flex-wrap:nowrap">${ed?`<button class="btn sm" data-a="apEdit" data-id="${r.id}">Edit</button><button class="btn sm d" data-a="apDel" data-id="${r.id}">Delete</button>`:''}</div></td></tr>`).join(''),'No bands. Anyone with approve permission can approve.')}</div>
  <div class="panel"><div class="row c" style="justify-content:space-between"><h2>Integrations</h2>${pill('Phase 2','wa')}</div>
   <div class="setrow"><div><b>OMS · Bond Desk to OMS</b><div class="mu">Sent when the PI is approved for payment.</div><ul class="mu" style="margin:6px 0 0;padding-left:18px"><li>Bond reference (matching key) and PI number, PI date</li><li>Insurer as vendor, with GSTIN and payee bank details</li><li>Premium, GST, stamp paper, total</li><li>Legal entity, BU and cost centre</li><li>PI file</li></ul></div><label class="toggle"><input type="checkbox" disabled> <span>Phase 2</span></label></div>
   <div class="setrow"><div><b>OMS · OMS back to Bond Desk</b><div class="mu">Fills the payment step on its own instead of Finance typing it.</div><ul class="mu" style="margin:6px 0 0;padding-left:18px"><li>OMS invoice ID and status (submitted, approved, rejected with reason)</li><li>Approver and approval date</li><li>UTR, value date, amount, debit bank account, payment mode</li></ul></div><label class="toggle"><input type="checkbox" disabled> <span>Phase 2</span></label></div>
   <div class="setrow"><div><b>Matching key</b><div class="mu">The bond reference (for example BND/ZW/FY27/0087) goes with the invoice and comes back on every OMS update.</div></div></div>
   <div class="setrow"><div><b>Mail · import saved emails</b><div class="mu">Available now: on a bond request, Communication → Import email (.eml). Each reply in the chain is split out with sender and time.</div></div><label class="toggle"><input type="checkbox" checked disabled> <span>On</span></label></div>
   <div class="setrow"><div><b>Mail · auto-file from the CSO mailbox</b><div class="mu">Mails whose subject carries the bond reference are filed to that request; the rest go to a triage list. Needs IT approval for mailbox access. Start subjects with the reference, e.g. [BND/ZW/FY27/0087].</div></div><label class="toggle"><input type="checkbox" disabled> <span>Phase 2</span></label></div></div>
  <div class="panel"><h2>Appearance</h2><p class="mu" style="margin:0 0 10px">Colour theme, dark mode, font and menu behaviour are set per person.</p><button class="btn" data-a="appOpen">Open appearance</button></div>`};
CH.sTog=el=>{const k=el.dataset.k;if(k==='sla'){S.settings.sla={...SET_DEF.sla,...S.settings.sla,on:el.checked}}else S.settings[k]=el.checked;audit('Settings',(k==='ocr'?'Document reading':'SLA tracking')+' switched '+(el.checked?'on':'off'),'','');save();render();toast((k==='ocr'?'Document reading':'SLA tracking')+(el.checked?' is on.':' is off.'))};
CH.sSla=el=>{const s=S.settings.sla;s.days={...s.days,[el.dataset.k]:num(el.value)};audit('Settings','SLA changed',el.dataset.k,el.value+' days');save()};
CH.sNum=el=>{S.settings[el.dataset.k]=num(el.value);audit('Settings','Changed '+el.dataset.k,'',el.value);save();toast('Saved.')};
CH.sTxt=el=>{S.settings[el.dataset.k]=el.value.trim();audit('Settings','Changed '+el.dataset.k,'',el.value);save();toast('Saved.')};
function apForm(r){ui.modal={kind:'ap',id:r?.id||null};modal(`<h2>${r?'Edit':'New'} approval band</h2><div class="grid g2">${fld('Currency','<select id="apCur">'+opts(MA('currencies').map(c=>c.code),r?.currency||'INR')+'</select>')}${fld('Approver role','<select id="apRole">'+opts(ACCESS.roles.map(x=>[x.id,x.name]),r?.role||'r_ck')+'</select>')}
  ${fld('From (in Cr for INR, M for USD)',`<input type="number" step="any" id="apMin" value="${esc(r?.min??0)}">`)}${fld('Up to (blank = no limit)',`<input type="number" step="any" id="apMax" value="${esc(r?.max??'')}">`)}${fld('Label',`<input id="apLbl" value="${esc(r?.label||'')}">`,'','full')}</div>
  <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="apSave">Save</button></div>`)}
A.apNew=()=>apForm(null);A.apEdit=el=>apForm(S.settings.approval.find(x=>x.id===el.dataset.id));
A.apSave=()=>{const o={currency:val('apCur'),role:val('apRole'),min:num(val('apMin'))||0,max:num(val('apMax')),label:val('apLbl')};if(o.max!=null&&o.max<=o.min)return toast('“Up to” must be more than “From”.',1);
  if(ui.modal.id)Object.assign(S.settings.approval.find(x=>x.id===ui.modal.id),o);else (S.settings.approval=S.settings.approval||[]).push({id:uid('ap'),...o});
  S.settings.approval.sort((a,b)=>(a.currency+String(a.min).padStart(8,'0')).localeCompare(b.currency+String(b.min).padStart(8,'0')));audit('Settings','Approval band saved',o.currency+' '+o.min+'–'+(o.max??'∞'),ACCESS.roles.find(x=>x.id===o.role)?.name);closeModal();save();render()};
A.apDel=el=>confirmBox('Delete this band?','Requests in its amount range fall to the first band, or to anyone with approve permission.','Delete',()=>{S.settings.approval=S.settings.approval.filter(x=>x.id!==el.dataset.id);audit('Settings','Approval band deleted','','');save();render()},{danger:true});

/* ============ Audit log ============ */
VIEWS.audit=()=>{const T=TBL.audit={key:'audit',cols:[{k:'t',l:'When',g:x=>x.t||''},{k:'u',l:'User',g:x=>x.user},{k:'r',l:'Role',g:x=>x.role},{k:'s',l:'Signed-in account',g:x=>x.by},{k:'c',l:'Area',g:x=>x.cat},{k:'a',l:'Action',g:x=>x.action},{k:'f',l:'Reference',g:x=>x.ref},{k:'d',l:'Details',g:x=>x.detail}],rows:()=>AUDIT.slice().sort((a,b)=>(b.t||'').localeCompare(a.t||''))};
  const rows=ftRows(T);
  return `<div class="panel">${ftBar(T,'Search the log',can('audit','export')?'<button class="btn" data-a="audXl">Export to Excel</button>':'')}<p class="mu" style="margin:0">Entries are only ever added. ${MODE==='shared'?'Each person’s entries are stored under their own account.':''}</p></div>
  <div class="mu" style="margin-bottom:6px">Showing ${Math.min(rows.length,500)} of ${rows.length}</div>
  <div class="tw"><table><thead><tr>${ftHead(T)}</tr></thead><tbody>${rows.slice(0,500).map(x=>`<tr><td class="w">${fdt(x.t)}</td><td>${esc(x.user)}</td><td>${esc(x.role)}</td><td>${esc(x.by)}</td><td>${esc(x.cat)}</td><td>${esc(x.action)}</td><td class="w">${esc(x.ref)}</td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">No entries match.</td></tr>'}</tbody></table></div>`};
A.audXl=()=>{const rows=ftRows(TBL.audit);xlsxOut('Bond_Desk_audit_'+TODAY+'.xlsx',[['Audit log',[TBL.audit.cols.map(c=>c.l),...rows.map(x=>TBL.audit.cols.map(c=>c.g(x)))]]])};

/* ============ boot ============ */
function bootScreen(){const v=$('#view');$('#nav').innerHTML='';
  if(MODE==='loading')v.innerHTML='<div class="empty" style="padding:80px 0"><span class="spin"></span> Loading Bond Desk…</div>';
  else if(MODE==='empty')v.innerHTML=`<div class="panel" style="max-width:640px"><h2>Bond Desk is not set up yet</h2>${IS_OWNER?'<p class="lead">Load the starting data: the Surety Bond Tracker (domestic and international), insurer lines and masters. Everyone with access then works on the same data.</p><button class="btn p" data-a="seedGo">Load starting data</button>':'<p class="lead">The owner has not loaded any data yet.</p>'}</div>`;
  else v.innerHTML='<div class="empty" style="padding:80px 0">Bond Desk could not load its data. Reload the page to try again.</div>'}
function ensureOwner(){if(!IS_OWNER||!ME.id)return;let u=ACCESS.users.find(x=>x.uid===ME.id);if(!u){u={id:uid('usr_'),name:ME.name||'Owner',email:'',uid:ME.id,roles:['r_sa'],active:true,createdAt:'2026-10-01T00:00:00',createdBy:'System'};ACCESS.users.unshift(u)}if(!u.roles.includes('r_sa'))u.roles.unshift('r_sa');u.active=true}
async function fetchSeed(){const r=await fetch('seed.json');if(!r.ok)throw 0;return r.json()}
function fromSeed(st){const cfg=migrateCfg(st);return {...cfg,bonds:(st.bonds||[]).map(b=>{S={...cfg,bonds:[]};return migrateBond(clone(b))})}}
async function loadLocal(){let st=null;try{st=JSON.parse(localStorage.getItem(KEY)||'null');PREFS={...PREFS,...JSON.parse(localStorage.getItem(KEY+'.prefs')||'{}')}}catch(e){}
  if(st&&st.S){S=st.S;ACCESS=st.ACCESS;AUDIT=st.AUDIT||[]}
  else{try{S=fromSeed(await fetchSeed())}catch(e){MODE='error';render();return}ACCESS=migrateAccess({});ACCESS.users=[{id:'usr_me',name:'You (Super Admin)',roles:['r_sa'],active:true,createdAt:'2026-10-01T00:00:00'},...demoUsers()]}
  MODE='local';applyAppearance();render()}
A.seedGo=async el=>{el.disabled=true;el.textContent='Loading…';try{S=fromSeed(await fetchSeed());ACCESS=migrateAccess({});ensureOwner();ACCESS.users.push(...demoUsers());MODE='shared';audit('Migration','Starting data loaded','','Surety Bond Tracker');await flush();subscribe();render();toast('Starting data loaded.')}catch(e){el.disabled=false;el.textContent='Load starting data';toast('Could not load the starting data.',1)}};
async function boot(){
  applyAppearance();
  DB=window.claude?.use?await window.claude.use('db').catch(()=>null):null;
  if(!DB){await loadLocal();return}
  USERCAP=await window.claude.use('user').catch(()=>null);
  if(USERCAP){try{const m=await USERCAP.me();ME={id:m.id,name:m.name||''};IS_OWNER=!!m.isOwner}catch(e){}try{if(!IS_OWNER)IS_OWNER=!!(await USERCAP.isOwner())}catch(e){}try{if(await USERCAP.can('data.write')===false)CAN_WRITE=false}catch(e){}}
  try{const pf=ME.id?await DB.doc('data/users/'+ME.id+'/prefs').get():null;if(pf&&pf.exists){const p=clone(pf.data());PREFS={...PREFS,actAs:p.actAs||null,app:p.app||{},module:p.module||'bonds'};LAST['data/users/'+ME.id+'/prefs']=canon(PREFS)}}catch(e){}
  applyAppearance();
  let main;try{main=await DB.doc('cfg/main').get()}catch(e){await loadLocal();toast('Shared data could not be reached, so this view works from this browser only.',1);return}
  if(!main.exists){MODE='empty';render();return}
  const raw=clone(main.data()),migr=raw.v!==6;LAST['cfg/main']=canon(raw);
  if(migr){try{const bk=await DB.doc('cfg/main_v5_backup').get();if(!bk.exists)await DB.doc('cfg/main_v5_backup').set(raw)}catch(e){}}
  S={...migrateCfg(raw),bonds:[]};
  const acc=await DB.doc('cfg/access').get();let a=acc.exists?clone(acc.data()):{};if(acc.exists)LAST['cfg/access']=canon(a);
  const ids=Object.keys(a.members||{});if(ids.length&&USERCAP){try{const ps=await USERCAP.profiles(ids);ids.forEach(i=>NAMES[i]=ps[i]?.name||'')}catch(e){}}
  ACCESS=migrateAccess(a);ensureOwner();if(migr&&!ACCESS.users.some(u=>u.demo))ACCESS.users.push(...demoUsers());
  const bs=await DB.collection('bonds').get();S.bonds=bs.docs.map(d=>{const o=clone(d.data());LAST['bonds/'+d.id]=canon(o);return migrateBond(o)});
  try{const ss=await DB.collection('sys').get();const pre=(ME.id||'anon')+'-';ss.docs.forEach(d=>{const v=clone(d.data());LAST['sys/'+d.id]=canon(v);SYSDOCS[d.id]=v;if(d.id.startsWith(pre))MYSYS[d.id.slice(pre.length)]={audit:v.audit||[]}});AUDIT=Object.values(SYSDOCS).flatMap(v=>(v.audit||[]).map(normAudit))}catch(e){}
  MODE='shared';
  const lu=ACCESS.users.filter(u=>u.uid&&!NAMES[u.uid]).map(u=>u.uid);if(lu.length&&USERCAP){try{const ps=await USERCAP.profiles(lu);lu.forEach(i=>NAMES[i]=ps[i]?.name||'')}catch(e){}}
  if(migr)audit('Migration','Bond Desk upgraded to the 6-step flow','','Masters, users and '+S.bonds.length+' bonds migrated; earlier settings kept in cfg/main_v5_backup');
  render();subscribe();if(migr)save();
}
let pendingRender=false;
function softRender(){const a=document.activeElement;if(inModal()||(a&&a.closest('#view')&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!/checkbox|radio|file/.test(a.type))){pendingRender=true;return}render()}
document.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{const a=document.activeElement;if(!inModal()&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))){pendingRender=false;render()}},60)});
function subscribe(){
  const err=e=>{if(e?.code==='revoked'){MODE='local';toast('Access to the shared data ended. Reload the page.',1)}};
  DB.collection('bonds').onSnapshot(snap=>{let ch=false;snap.docChanges().forEach(c=>{const p='bonds/'+c.doc.id;if(c.type==='removed'){S.bonds=S.bonds.filter(b=>b.id!==c.doc.id);delete LAST[p];ch=true;return}
    const o=clone(c.doc.data()),j=canon(o);if(LAST[p]===j)return;LAST[p]=j;migrateBond(o);const old=S.bonds.find(b=>b.id===o.id);if(old){if(ui.draft===old)return;Object.keys(old).forEach(k=>delete old[k]);Object.assign(old,o)}else S.bonds.push(o);ch=true});if(ch)softRender()},err);
  DB.doc('cfg/main').onSnapshot(d=>{if(!d.exists)return;const o=clone(d.data()),j=canon(o);if(LAST['cfg/main']===j||o.v!==6)return;LAST['cfg/main']=j;S.settings=o.settings;S.m=o.m;softRender()},err);
  DB.doc('cfg/access').onSnapshot(d=>{if(!d.exists)return;const o=clone(d.data()),j=canon(o);if(LAST['cfg/access']===j||!o.users)return;LAST['cfg/access']=j;ACCESS=o;softRender()},err);
  DB.collection('sys').onSnapshot(snap=>{let ch=false;snap.docChanges().forEach(c=>{const p='sys/'+c.doc.id,o=clone(c.doc.data()),j=canon(o);if(LAST[p]===j)return;LAST[p]=j;SYSDOCS[c.doc.id]=o;ch=true});if(ch){const mine=(ME.id||'anon')+'-';Object.entries(MYSYS).forEach(([m,v])=>SYSDOCS[mine+m]=v);AUDIT=Object.values(SYSDOCS).flatMap(v=>(v.audit||[]).map(normAudit));if(ui.route==='audit')softRender()}},err);
}

/* ============ wiring ============ */
document.addEventListener('click',e=>{
  const sc=e.target.closest('[data-scrim]');if(sc&&e.target===sc){closeModal();return}
  const fk=e.target.closest('[data-fk]');if(fk){e.stopPropagation();const [k,c]=fk.dataset.fk.split('|');openF(k,c,fk);return}
  const g=e.target.closest('[data-go]');if(g){closeModal();go(g.dataset.go);return}
  const a=e.target.closest('[data-a]');if(a&&A[a.dataset.a]&&!a.disabled){e.preventDefault();A[a.dataset.a](a,e);return}
  if(!e.target.closest('#pop'))closePop();
  if(document.documentElement.classList.contains('nav-open')&&!e.target.closest('.side')&&!e.target.closest('.menubtn'))navClose()});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(el&&CH[el.dataset.ch])CH[el.dataset.ch](el,e)});
let inT;document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(!el)return;const f=CH[el.dataset.in];if(!f)return;if(['piCalc','qRate','appSize'].includes(el.dataset.in))return f(el,e);clearTimeout(inT);inT=setTimeout(()=>f(el,e),250)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#pop'))closePop();else if(inModal())closeModal()}});
addEventListener('resize',closePop);
addEventListener('beforeunload',()=>autoSaveDraft());
boot();
</script>
