<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Zetwerk Bond Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: RCM-style finance console — coloured side menu, white panels on a cool ground, one table per screen with Excel-style column filters */
:root{
  --font:"IBM Plex Sans"; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace; --fs:14px;
  --bg:#F3F5F8; --panel:#FFFFFF; --field:#FFFFFF; --th:#EEF2F7; --hover:#F6F8FB; --soft:#F6F8FB; --ink:#18212E; --mu:#5C6878; --line:#DCE2EA; --line2:#ECF0F5; --line3:#B9C3D0;
  --ac:#1D5FA8; --ac2:#164C87; --side:#0E2440; --sidetx:#C6D3E3; --sideac:#7DB3EE; --acs:color-mix(in srgb,var(--ac) 12%,var(--panel));
  --ok:#1E7A4C; --oks:#E3F4EA; --okt:#14532D; --wa:#9A5B06; --was:#FFF3DC; --wat:#6B3F03; --er:#B42318; --ers:#FDECEA; --ert:#7A160F; --in:#2F5DA8; --ins:#E8EFFA; --int:#1E3F78; --grs:#EEF1F4;
  --r1:6px; --r2:10px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-mode="light"]){
  --bg:#0E131B;--panel:#161D28;--field:#111821;--th:#1C2533;--hover:#1A2230;--soft:#1A2230;--ink:#E3E9F1;--mu:#94A2B5;--line:#2B3647;--line2:#222C3B;--line3:#3D4A5E;
  --acs:color-mix(in srgb,var(--ac) 26%,var(--panel));--ok:#4ADE80;--oks:#123122;--okt:#B4F2CB;--wa:#F5B544;--was:#342609;--wat:#FAD9A1;--er:#F87171;--ers:#3B1614;--ert:#FBC4BF;--in:#8DB4F0;--ins:#17243B;--int:#C9DBF7;--grs:#222C3B;color-scheme:dark}}
:root[data-theme="dark"]:not([data-mode="light"]),:root[data-mode="dark"]{
  --bg:#0E131B;--panel:#161D28;--field:#111821;--th:#1C2533;--hover:#1A2230;--soft:#1A2230;--ink:#E3E9F1;--mu:#94A2B5;--line:#2B3647;--line2:#222C3B;--line3:#3D4A5E;
  --acs:color-mix(in srgb,var(--ac) 26%,var(--panel));--ok:#4ADE80;--oks:#123122;--okt:#B4F2CB;--wa:#F5B544;--was:#342609;--wat:#FAD9A1;--er:#F87171;--ers:#3B1614;--ert:#FBC4BF;--in:#8DB4F0;--ins:#17243B;--int:#C9DBF7;--grs:#222C3B;color-scheme:dark}
:root[data-mode="light"]{color-scheme:light}
*,*::before,*::after{box-sizing:inherit}
:root[data-mode="dark"] .side{background:color-mix(in srgb,var(--side) 70%,#000)}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 var(--font),"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ac)}
h1,h2,h3{text-wrap:balance}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
/* sidebar */
.side{background:var(--side);color:var(--sidetx);padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{display:flex;gap:10px;align-items:center;padding:4px 30px 12px 6px;position:relative}
.logo{width:36px;height:36px;border-radius:8px;background:linear-gradient(135deg,var(--sideac),color-mix(in srgb,var(--sideac) 40%,#fff));color:var(--side);display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none}
.brand b{display:block;color:#fff;font-size:1.07rem;line-height:1.2}
.brand span{font-size:.82rem;color:rgba(255,255,255,.55)}
.navpin{position:absolute;right:0;top:6px;background:none;border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);cursor:pointer;font-size:1rem;line-height:1;border-radius:6px;width:26px;height:26px}
.navpin:hover{background:rgba(255,255,255,.08);color:#fff}
.modsel{margin:0 0 10px;padding:0 0 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.modsel label{display:block;font-size:.78rem;color:rgba(255,255,255,.45);margin:0 0 4px 6px;letter-spacing:.04em;text-transform:uppercase}
.modsel select{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:8px;padding:7px 9px}
.modsel select option{color:#18212E;background:#fff}
.nav-g{margin:12px 0 4px;padding:0 8px;font-size:.78rem;color:rgba(255,255,255,.45);letter-spacing:.04em;text-transform:uppercase}
.nav button{display:block;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;color:var(--sidetx);padding:7px 10px;border-radius:0 6px 6px 0;cursor:pointer;margin:1px 0}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}
.nav button.on{background:color-mix(in srgb,var(--sideac) 18%,transparent);border-left-color:var(--sideac);color:#fff;font-weight:500}
.nav .cnt{float:right;background:var(--er);color:#fff;border-radius:9px;font-size:.78rem;padding:0 6px;line-height:18px;margin-top:2px}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.08)}
.side-foot button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:0;color:var(--sidetx);padding:8px 10px;border-radius:6px;cursor:pointer}
.side-foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side-foot .sw-dot{width:14px;height:14px;border-radius:50%;background:var(--sideac);flex:none}
.side-foot small{display:block;color:rgba(255,255,255,.4);font-size:.75rem;padding:4px 10px 0}
.menubtn{display:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:var(--r1);width:38px;height:38px;cursor:pointer;font-size:1.1rem}
.edge{display:none}
:root[data-nav="auto"] .app{grid-template-columns:minmax(0,1fr)}
:root[data-nav="auto"] .menubtn{display:inline-grid;place-items:center}
:root[data-nav="auto"] .side{position:fixed;left:0;top:0;bottom:0;height:100vh;width:256px;z-index:26;transform:translateX(-102%);transition:transform .18s ease}
:root[data-nav="auto"].nav-open .side{transform:none;box-shadow:8px 0 32px rgba(0,0,0,.28)}
:root[data-nav="auto"] .edge{display:block;position:fixed;left:0;top:0;width:10px;height:100vh;z-index:25}
/* main */
main{min-width:0;display:flex;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:10}
.top h1{margin:0;font-size:1.43rem;font-weight:600}
.top .sub{color:var(--mu);font-size:.93rem}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.who select{min-width:240px}
.demo-pill{white-space:nowrap;font-size:.86rem;background:var(--was);color:var(--wa);border-radius:20px;padding:2px 10px}
.live-pill{white-space:nowrap;font-size:.86rem;background:var(--oks);color:var(--ok);border-radius:20px;padding:2px 10px}
.view{padding-block:20px 56px;padding-inline:24px;max-width:1360px;width:100%}
/* building blocks */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:18px;margin-bottom:16px;min-width:0}
.panel h2{font-size:1.14rem;margin:0 0 4px;font-weight:600}
.panel h3{font-size:1rem;margin:0 0 8px;font-weight:600}
.lead{color:var(--mu);margin:0 0 14px;max-width:80ch}
.mu{color:var(--mu);font-size:.93rem}
.mono{font-family:var(--mono);font-size:.92em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row.c{align-items:center}
.sp{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 16px}
.grid.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.fld{min-width:0}
.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:.93rem;color:var(--mu);margin-bottom:4px}
.fld .hint{font-size:.86rem;color:var(--mu);margin-top:3px}
.req{color:var(--er)}
input[type=text],input[type=date],input[type=number],input[type=email],input[type=search],input:not([type]),select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r1);background:var(--field);color:var(--ink);min-height:38px}
textarea{min-height:70px;resize:vertical}
input[readonly]{background:var(--bg);color:var(--mu)}
input.x,select.x,textarea.x{border-color:var(--in);background:var(--ins)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--ac);vertical-align:middle;margin:0}
select[multiple]{min-height:96px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:var(--r1);cursor:pointer;min-height:38px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--line3);background:var(--hover)}
.btn.p{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.p:hover{background:var(--ac2)}
.btn.d{color:var(--er)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:.93rem}
.btn.link{border:0;background:none;color:var(--ac);padding:0;min-height:0;text-decoration:underline;text-underline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r1)}
table{width:100%;border-collapse:collapse;background:var(--panel)}
th{background:var(--th);color:var(--mu);font-weight:500;font-size:.93rem;text-align:left;padding:8px 10px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--hover)}
tr.click{cursor:pointer}
td.n,th.n{text-align:right}
td.w{white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--mu)}
.hc{display:inline-flex;gap:4px;align-items:center}
.fb{border:1px solid transparent;background:none;color:var(--mu);border-radius:4px;padding:0 4px;cursor:pointer;line-height:18px}
.fb:hover{border-color:var(--line)}
.fb.on{background:var(--ac);color:#fff}
.stk{position:sticky;right:0;background:var(--panel);box-shadow:-8px 0 8px -8px rgba(0,0,0,.18);z-index:1}
th.stk{background:var(--th);z-index:2}
tbody tr:hover td.stk{background:var(--hover)}
/* pills */
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:.86rem;font-weight:500;white-space:nowrap}
.pill.ac{background:var(--acs);color:var(--ac2)}
.pill.in{background:var(--ins);color:var(--in)}
.pill.ok{background:var(--oks);color:var(--ok)}
.pill.er{background:var(--ers);color:var(--er)}
.pill.wa{background:var(--was);color:var(--wa)}
.pill.gr{background:var(--grs);color:var(--mu)}
:root[data-mode="dark"] .pill.ac{color:var(--ink)}
.note{border-radius:var(--r1);padding:10px 12px;margin:0 0 12px;font-size:.93rem}
.note.w{background:var(--was);color:var(--wat)}
.note.e{background:var(--ers);color:var(--ert)}
.note.i{background:var(--ins);color:var(--int)}
.note.o{background:var(--oks);color:var(--okt)}
.note ul{margin:6px 0 0;padding-left:18px}
/* stepper */
.stepper{display:flex;list-style:none;margin:0 0 6px;padding:0;overflow-x:auto}
.stepper li{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:104px;text-align:center}
.stepper li::before{content:"";position:absolute;top:14px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.stepper li:first-child::before{display:none}
.stepper li.done::before,.stepper li.cur::before{background:var(--ac)}
.stepper .dot{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:2px solid var(--line3);font-size:.86rem;font-weight:600;color:var(--mu)}
.stepper li.done .dot{background:var(--ac);border-color:var(--ac);color:#fff}
.stepper li.cur .dot{border-color:var(--ac);color:var(--ac);box-shadow:0 0 0 4px var(--acs)}
.stepper .lbl{font-size:.86rem;color:var(--mu);margin-top:6px;padding:0 4px}
.stepper li.cur .lbl{color:var(--ink);font-weight:600}
.stepper .who2{font-size:.76rem;color:var(--mu)}
/* sub-steps inside a step */
.sub{border:1px solid var(--line);border-radius:var(--r2);margin-bottom:12px;overflow:hidden}
.sub-h{background:var(--soft);padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.sub-h b{font-weight:600}
.sub-h .k{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:600;background:var(--panel);border:1.5px solid var(--line3);color:var(--mu);flex:none}
.sub.done .sub-h .k{background:var(--ok);border-color:var(--ok);color:#fff}
.sub.cur .sub-h .k{border-color:var(--ac);color:var(--ac)}
.sub.lock{opacity:.6}
.sub-b{padding:12px 14px}
/* header facts */
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 18px;margin:4px 0 0}
.facts div span{display:block;font-size:.82rem;color:var(--mu)}
.facts div b{font-weight:600;overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin:8px 0}
.kv div span{display:block;font-size:.84rem;color:var(--mu)}
.kv div b{font-weight:500;overflow-wrap:anywhere}
/* popovers + modal */
.pop{position:fixed;z-index:40;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:var(--r2);box-shadow:0 12px 32px rgba(10,30,60,.22);padding:10px}
.fp{width:280px}
.fp>button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:6px 8px;border-radius:4px;cursor:pointer}
.fp>button:hover{background:var(--bg)}
.fp hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.fl{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:4px 6px;margin-top:6px}
.ck{display:flex;gap:8px;align-items:center;margin:4px 0;cursor:pointer;font-size:.93rem}
.scrim{position:fixed;inset:0;background:rgba(10,25,45,.45);z-index:30;display:grid;place-items:start center;padding:40px 12px;overflow-y:auto}
.dlg{background:var(--panel);border-radius:12px;width:640px;max-width:100%;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.dlg.wide{width:980px}
.dlg h2{margin:0 0 4px;font-size:1.28rem}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
/* misc */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:20px;padding:4px 12px;cursor:pointer;font-size:.93rem}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.chip .n{opacity:.7;margin-left:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.swg{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px;margin-bottom:16px}
.swatch{display:flex;gap:8px;align-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 9px;cursor:pointer;text-align:left}
.swatch i{width:18px;height:18px;border-radius:50%;flex:none}
.swatch.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--acs)}
input[type=range]{width:100%;accent-color:var(--ac)}
.toggle{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.toggle input{appearance:none;-webkit-appearance:none;width:40px;height:22px;border-radius:12px;background:var(--line3);position:relative;cursor:pointer;transition:background .15s;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.toggle input:checked{background:var(--ac)}
.toggle input:checked::after{left:21px}
.setrow{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow>div:first-child{max-width:70ch}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;text-align:left;color:var(--ink)}
button.stat{cursor:pointer;font:inherit}
button.stat:hover{border-color:var(--ac)}
.stat small{color:var(--mu);font-size:.89rem}
.stat strong{display:block;font-size:1.65rem;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.stat .s2{font-size:.86rem;color:var(--mu)}
.ov2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.meter{height:12px;border-radius:3px;background:var(--line2);display:flex;overflow:hidden;gap:2px}
.meter i{display:block;height:100%}
.meter .u{background:var(--ac)}
.meter .p{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ac) 45%,transparent) 0 3px,transparent 3px 6px);border:1px solid var(--ac)}
.meter .o{background:var(--er)}
.lim{padding:10px 0;border-bottom:1px solid var(--line2)}
.lim:last-child{border-bottom:0}
.legend{display:flex;gap:14px;font-size:.84rem;color:var(--mu);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.next-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.next-row:last-child{border-bottom:0}
.drop{display:flex;align-items:center;justify-content:space-between;gap:12px;border:2px dashed var(--line3);border-radius:10px;padding:14px 16px;background:var(--soft);flex-wrap:wrap}
.drop.over{border-color:var(--ac);background:var(--acs)}
.file{display:inline-flex;gap:6px;align-items:center;font-size:.93rem;overflow-wrap:anywhere}
.file::before{content:"";width:10px;height:12px;border:1.5px solid var(--mu);border-radius:2px;flex:none}
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:130px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:.93rem}
.tl li:last-child{border-bottom:0}
.perm td,.perm th{text-align:center}
.perm td:first-child,.perm th:first-child{text-align:left}
.ph{max-width:760px}
.ph ul{margin:8px 0 0;padding-left:20px}
.ph li{margin:4px 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--ac);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:80;max-width:calc(100% - 32px);font-size:.93rem}
#toast.e{background:var(--er);color:#fff}
.hide{display:none!important}
/* paper documents (PI preview, payment advice): always paper colours */
.sheet-wrap{overflow-x:auto;background:var(--soft);border-radius:8px;padding:14px}
.sheet{background:#fff;color:#18212E;width:720px;margin:0 auto;padding:24px 28px;font-size:12px;line-height:1.5;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.12)}
.sheet .srule{height:3px;background:#1D5FA8;margin-bottom:14px}
.sheet .shd{display:flex;justify-content:space-between;gap:16px;margin-bottom:12px}
.sheet h3{margin:0;font-size:20px;color:#1D5FA8;letter-spacing:.02em}

function migrateBond(b){
  if(b.mv===6)return b;
  const created=b.created?b.created+'T10:00:00':(b.log?.[0]?.t?(b.log[0].t.length===16?b.log[0].t+':00':b.log[0].t):(b.start||TODAY)+'T10:00:00');
  b.mv=6;b.kind=b.kind==='extension'?'ext':b.kind==='amendment'?'amd':(b.kind||'new');
  b.createdAt=created;b.requestedAt=created;
  b.requestor=b.requester||(b.source==='tracker'?'Surety Bond Tracker':(b.log?.[0]?.who||'—'));
  b.createdBy=null;b.docReqs=b.docReqs||[];
  b.period=b.calc?{mode:'bid',sub:b.calc.sub||'',validityMode:'days',validity:b.calc.validity||'',validityDate:'',cond:b.calc.cond||'',add:b.calc.add||'',claimDays:b.calc.claimDays||''}:{mode:/bid/i.test(b.type||'')?'bid':'manual',sub:b.submission||'',validityMode:'days',validity:'',validityDate:'',cond:'',add:'',claimDays:''};
  if(b.calc&&!b.period.validity&&b.calc.sub&&b.expiry)b.period.validity=dBetween(b.calc.sub,b.expiry);
  const reqC=b.packs?.request?.versions?.slice(-1)[0];
  b.reqDocs=slotsFor(b.type).map(s=>{if(reqC){const hit=matchDoc(s.name,reqC.contents||[])[0];if(hit)s.file={name:hit,from:reqC.file,at:reqC.date,by:reqC.by}}return s});
  if(b.status==='open'){
    b.step=b.stage==='payment'?'placement':'verify';
    b.verify=b.packs?.request?.status==='accepted'||b.step==='placement'?{docsOk:true,at:b.stageSince||created,by:'Migration'}:{docsOk:false};
    if(b.insurer){const insC=b.packs?.insurer?.versions?.slice(-1)[0];b.insDocs=packFor(b.insurer).map(s=>{if(insC){const hit=matchDoc(s.name,insC.contents||[])[0];if(hit)s.file={name:hit,from:insC.file,at:insC.date,by:insC.by}}return s});
      if(['sent','accepted'].includes(b.packs?.insurer?.status))b.insPackOk={at:b.stageSince||created,by:'Migration'};
      if(!b.broker)b.broker='Direct'}
    if(b.quote&&b.quote.rate!=null)b.quote={rate:b.quote.rate,premium:b.quote.premium,date:(b.stageSince||created).slice(0,10),remarks:'',at:b.stageSince||created,by:'Migration'};
    if(b.step==='placement')b.approval={status:'approved',at:b.stageSince||created,by:'Migration',comment:'Approved in the earlier prototype'};
    b.pi=b.pi&&b.pi.no?{no:b.pi.no,date:'',premium:b.pi.premium,gst:b.pi.gst,stamp:b.pi.stamp||0,total:b.pi.total,file:b.pi.file?{name:b.pi.file}:null,gstinOk:!!b.pi.gstOk}:null;
    b.stepSince=b.stageSince||created;

  return b;
}
function migrateAccess(a){

async function put(path,obj){const j=canon(obj);if(LAST[path]===j||!CAN_WRITE)return;LAST[path]=j;
  try{await DB.doc(path).set(clone(obj))}catch(e){delete LAST[path];
    if(e?.code==='quota_exceeded')toast('Shared storage is full: '+e.message,1);
    else if(e?.code==='unavailable'){await new Promise(r=>setTimeout(r,500));try{await DB.doc(path).set(clone(obj));LAST[path]=j}catch(e2){toast('Could not save. Check your connection and try again.',1)}}
    else if(/permission|denied|not_granted|level/i.test((e?.code||'')+' '+(e?.message||''))){CAN_WRITE=false;toast('Your access to this page is view-only, so changes are not saved.',1)}

<script>
/* ============ bond logic ============ */
function util(name){const i=insOf(name),c=i?.currency||'INR';const L=S.bonds.filter(b=>b.insurer===name&&b.kind==='new'&&curOf(b)===c);
  const used=L.filter(b=>b.status==='issued').reduce((a,b)=>a+(+b.amount||0),0),pipe=L.filter(b=>b.status==='open').reduce((a,b)=>a+(+b.amount||0),0),lim=(+i?.limit||0)*(+CUR(c).unitVal||1);
  return {used,pipe,lim,avail:lim-used,c}}
function bandFor(b){const c=curOf(b),amt=(+b.amount||0)/(+CUR(c).unitVal||1),L=S.settings.approval||[];return L.find(r=>(r.currency||'INR')===c&&amt>=(+r.min||0)&&(r.max==null||r.max===''||amt<+r.max))||L[0]||null}
function canApprove(b){const u=me();if(!can('approve','approve'))return false;if(isSA())return true;if(b.createdBy&&b.createdBy===u.id)return false;const band=bandFor(b);return !band||hasRole(u,band.role)}
const openReq=(b,pack)=>(b.docReqs||[]).find(r=>!r.closedAt&&(!pack||r.pack===pack));
function piVar(b){const q=+b.quote?.premium||0,p=+b.pi?.premium||0;if(!b.pi||!q)return {pct:0,over:false,diff:0};const diff=p-q,pct=diff/q*100;return {diff,pct,over:Math.abs(pct)>(+S.settings.premTol||0)}}
function pending(b){
  if(b.status==='draft')return [{who:'maker',text:'Draft · not submitted'}];
  if(b.status!=='open')return [];
  if(b.step==='request')return [{who:'maker',text:b.returned?.kind==='reject'?'Rejected at approval · revise and resubmit':'Returned · revise and resubmit'}];
  const out=[],r=openReq(b);
  if(r&&!r.submittedAt)out.push({who:'maker',text:'Documents requested ('+r.docs.length+')'});
  switch(b.step){
    case 'verify':
      if(r&&r.submittedAt)out.push({who:'team',text:'Check documents sent back by BU'});
      else if(!r){if(!b.verify?.docsOk)out.push({who:'team',text:'Verify request documents'});else if(!b.insurer)out.push({who:'team',text:'Select insurer and route'});else if(!b.insPackOk)out.push({who:'team',text:'Accept insurer document pack'});else out.push({who:'team',text:'Record insurer quote'})}
      break;
    case 'approval':out.push({who:'approver',text:'Internal approval'});break;
    case 'placement':
      if(!b.pi)out.push({who:'team',text:'Enter proforma invoice (PI)'});
      else if(piVar(b).over&&!b.pi.accepted)out.push({who:'finance',text:'Accept premium variance'});
      if(!b.draft?.file)out.push({who:'team',text:'Upload draft bond'});else if(!b.draft.confirmed)out.push({who:'maker',text:'Confirm draft bond wording'});
      if(b.pi&&(!piVar(b).over||b.pi.accepted)&&!b.payment)out.push({who:'finance',text:'Record payment and UTR'});
      break;
    case 'issue':out.push({who:'team',text:'Upload final bond'});break;
    case 'closure':out.push({who:'team',text:'Upload tax invoice'});break;
  }
  return out}
function isMaker(b){const u=me();if(b.createdBy)return b.createdBy===u.id||isSA();return can('request','create')&&(!u.bu||u.bu===b.bu)}
function mineWho(b,who){switch(who){case 'maker':return isMaker(b);case 'team':return b.step==='verify'?can('verify','edit'):b.step==='placement'?can('placement','edit'):can('issue','edit');case 'approver':return canApprove(b);case 'finance':return can('payment','edit')}return false}
const isMine=b=>pending(b).some(p=>mineWho(b,p.who));
const WHO_L={maker:'BU (maker)',team:'Bond team',approver:'Approver',finance:'Finance'};
function statusL(b){if(b.status==='draft')return ['Draft','gr'];if(b.status==='open')return [b.step==='request'?'Returned to BU':'In progress','in'];
  if(b.status==='issued'){if(b.kind!=='new')return ['Endorsed','ok'];if(b.invocation&&b.invocation.status!=='closed')return ['Live · invoked','er'];return [b.step==='closure'?'Live · tax invoice due':'Live','ok']}
  return [{expired:'Expired',released:'Returned',cancelled:'Cancelled',withdrawn:'Withdrawn',rejected:'Rejected'}[b.status]||b.status,'gr']}
const statusPill=b=>{const [t,c]=statusL(b);return pill(t,c)};
function slaPill(b){const s=S.settings.sla;if(!s?.on||b.status!=='open')return '';const lim=+s.days?.[b.step];if(!lim)return '';const age=dBetween(b.stepSince||b.requestedAt,TODAY);return age>lim?' '+pill('SLA overdue '+(age-lim)+'d','er'):''}
const verOf=b=>b.kind==='new'?(b.status==='issued'||b.status==='expired'||b.status==='released'?'V'+(b.version||1):'V1 (pending)'):(b.producedVersion?'V'+b.producedVersion:'V'+((bond(b.parentId)?.version||1)+1)+' (pending)');
function nextRef(b){if(b.kind!=='new'){const p=bond(b.parentId),L=S.bonds.filter(x=>x.parentId===b.parentId&&x.kind===b.kind&&x.ref).length;return (p?.ref||'BND')+'/'+(b.kind==='ext'?'E':'A')+(L+1)}
  const code=entOf(b.entity)?.code||'ZW',pre='BND/'+code+'/'+fyOf(TODAY)+'/';let n=0;S.bonds.forEach(x=>{if(x.ref&&x.ref.startsWith(pre)){const m=+x.ref.slice(pre.length,pre.length+4);if(m>n)n=m}});return pre+String(n+1).padStart(4,'0')}
function calcPeriod(b){const p=b.period;if(!p||p.mode!=='bid')return;const v=p.validityMode==='date'?dBetween(p.sub,p.validityDate):num(p.validity);if(!p.sub||v==null)return;const tot=(+v||0)+(+p.cond||0)+(+p.add||0);b.start=p.sub;b.expiry=addDays(p.sub,tot);b.claim=addDays(b.expiry,+p.claimDays||0)}
function setStep(b,step){b.step=step;b.stepSince=now()}

/* ============ overview ============ */
ui.ovCur='INR';
VIEWS.overview=()=>{
  const live=S.bonds.filter(b=>b.status==='issued'&&b.kind==='new'),open=S.bonds.filter(b=>b.status==='open'),mine=S.bonds.filter(isMine);
  const warn=+S.settings.expiryWarn||60,exp=live.filter(b=>{const d=dBetween(TODAY,b.expiry);return d!=null&&d>=0&&d<=warn}).sort((a,b)=>a.expiry<b.expiry?-1:1);
  const cur=ui.ovCur,curs=uniq(MA('insurers').map(i=>i.currency||'INR'));
  const liveC=c=>live.filter(b=>curOf(b)===c).reduce((a,b)=>a+(+b.amount||0),0);
  const ins=MA('insurers').filter(i=>(i.currency||'INR')===cur).map(i=>({i,u:util(i.name)})).sort((a,b)=>b.u.lim-a.u.lim);
  const tot=ins.reduce((a,x)=>({lim:a.lim+x.u.lim,used:a.used+x.u.used,pipe:a.pipe+x.u.pipe}),{lim:0,used:0,pipe:0});
  return `<div class="stats">
   <button class="stat" data-a="toReg" data-chip="mine"><small>Waiting on you</small><strong>${mine.length}</strong><span class="s2">${mine.length?'Open the list':'Nothing pending'}</span></button>
   <button class="stat" data-a="toReg" data-chip="open"><small>Requests in progress</small><strong>${open.length}</strong><span class="s2">${STEPS.slice(1).map(s=>open.filter(b=>b.step===s.k).length).join(' · ')} by step 2–6</span></button>
   <button class="stat" data-a="toReg" data-chip="live"><small>Live bonds</small><strong>${live.length}</strong><span class="s2">${curs.map(c=>money(liveC(c),c)).join(' + ')}</span></button>
   <div class="stat"><small>Expiring in ${warn} days</small><strong>${exp.length}</strong><span class="s2">Raise extensions early</span></div></div>
  <div class="ov2"><div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:6px"><div><h2>Insurer limits</h2><span class="mu">Sanctioned line, issued and in pipeline. Over-limit is a warning only.</span></div>
   <div class="chips" style="margin:0">${curs.map(c=>`<button class="chip ${c===cur?'on':''}" data-a="ovCur" data-c="${c}">${c}</button>`).join('')}</div></div>
   <div class="legend" style="margin:6px 0 8px"><span><i style="background:var(--ac)"></i>Issued</span><span><i style="background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--ac) 45%,transparent) 0 3px,transparent 3px 6px);border:1px solid var(--ac)"></i>In pipeline</span><span><i style="background:var(--er)"></i>Over line</span></div>
   <div class="lim"><div class="row c" style="justify-content:space-between"><b>All insurers</b><span class="mu">${money(tot.used,cur)} of ${money(tot.lim,cur)} · ${money(tot.lim-tot.used,cur)} free</span></div></div>
   ${ins.map(({i,u})=>{const L=Math.max(u.lim,u.used+u.pipe,1),pu=Math.min(u.used,u.lim)/L*100,ov=Math.max(0,u.used-u.lim)/L*100,pp=u.pipe/L*100;return `<div class="lim"><div class="row c" style="justify-content:space-between;margin-bottom:5px"><span><b>${esc(i.name)}</b> <span class="mu">${esc(i.kind||'')}</span></span><span class="mu">${money(u.used,cur)} used · ${money(u.pipe,cur)} pipeline · <b style="color:${u.avail<0?'var(--er)':'var(--ink)'}">${money(u.avail,cur)} free</b> of ${money(u.lim,cur)}</span></div><div class="meter" role="img" aria-label="${esc(i.name)} limit use"><i class="u" style="width:${pu}%"></i>${ov?`<i class="o" style="width:${ov}%"></i>`:''}${pp?`<i class="p" style="width:${pp}%"></i>`:''}</div></div>`}).join('')||'<p class="mu">No insurers in this currency.</p>'}</div>
  <div><div class="panel"><h2>Waiting on you</h2>${mine.slice(0,8).map(b=>`<div class="next-row"><div><b>${esc(b.ref||'Draft')}</b> <span class="mu">${esc(b.type||'')} · ${money(b.amount,curOf(b))}</span><div class="mu">${esc(pending(b).find(p=>mineWho(b,p.who))?.text||'')}</div></div><button class="btn sm" data-a="openBond" data-id="${b.id}">Open</button></div>`).join('')||'<p class="mu">Nothing is waiting on you.</p>'}</div>
  <div class="panel"><h2>Expiring soon</h2>${exp.slice(0,6).map(b=>`<div class="next-row"><div><b>${esc(b.ref)}</b> <span class="mu">${esc(b.beneficiary||b.cust)}</span><div class="mu">Expires ${fd(b.expiry)} · ${dBetween(TODAY,b.expiry)} days</div></div><button class="btn sm" data-a="openBond" data-id="${b.id}">Open</button></div>`).join('')||`<p class="mu">No live bond expires in the next ${warn} days.</p>`}</div></div></div>`};

/* ============ New request (Step 1) ============ */
function blankBond(kind){const u=me();return {id:uid('b'),mv:6,ref:'',kind:kind||'new',status:'draft',step:'request',createdAt:now(),createdBy:u.id,requestor:u.name,bu:u.bu||'',financePoc:'',entity:'',geography:'',currency:'INR',cust:'',beneficiary:'',benClass:'',project:'',tenderRef:'',projectStatus:'',pct:'',reqStatus:'Required',contractValue:null,type:'',amount:null,requiredBy:'',
  period:{mode:'manual',sub:'',validityMode:'days',validity:'',validityDate:'',cond:'',add:'',claimDays:''},start:'',expiry:'',claim:'',reqDocs:[],wording:'',remarks:'',docReqs:[],log:[],complete:false}}

const psFor=t=>MA('projStatus').filter(s=>!s.types?.length||s.types.includes(t)).map(s=>s.name);

CH.df=el=>{const b=ui.draft;if(!b)return;const p=el.dataset.f;let v=el.value;if(el.type==='number')v=v===''?null:+v;if(el.type==='checkbox')v=el.checked;setPath(b,p,v);XF.delete(p);

  if(rr){const y=scrollY;render();scrollTo(0,y)}};

function reqErrors(b){const e=[];
  if(b.kind==='new'){if(!b.bu)e.push('Business unit');if(!b.entity)e.push('Legal entity');if(!b.type)e.push('Bond type');if(!(+b.amount>0))e.push('Bond amount');if(!b.beneficiary)e.push('Beneficiary');if(!b.project)e.push('Project name');if(!b.projectStatus)e.push('Project status');if(!b.reqStatus)e.push('Bond requirement status');if(!b.requiredBy)e.push('Required-by date');
    if(b.period.mode==='bid'){if(!b.period.sub)e.push('Bid submission date');if(b.period.validityMode==='date'?!b.period.validityDate:b.period.validity==='')e.push('Bid validity')}else{if(!b.start)e.push('Bond start date');if(!b.expiry)e.push('Bond expiry date')}}
  else{const c=b.changes||{},p=bond(b.parentId)||{};if(c.expiry===p.expiry&&c.claim===p.claim&&+c.amount===+p.amount&&c.beneficiary===p.beneficiary&&!c.wording)e.push('At least one change');if(!b.remarks)e.push('Reason for the change');if(!b.requiredBy)e.push('Required-by date')}
  b.reqDocs.forEach(d=>{if(d.mandatory&&!d.file&&!String(d.remark||'').trim())e.push(d.name+': upload it or give a remark');});
  if(!b.complete)e.push('Confirm the documents are complete');
  return e}
A.submitReq=()=>{const b=ui.draft,e=reqErrors(b);if(e.length){ui.reqErr=e;render();scrollTo(0,0);return toast('Fill the '+e.length+' item(s) listed at the top.',1)}
  ui.reqErr=null;const resub=b.status==='open';
  if(!b.ref)b.ref=nextRef(b);
  if(!S.bonds.includes(b))S.bonds.push(b);
  b.status='open';b.requestedAt=b.requestedAt&&resub?b.requestedAt:now();
  if(b.kind!=='new'){const p=bond(b.parentId);if(p&&!b.insurer){b.insurer=p.insurer;b.broker=p.broker||'Direct';b.insDocs=packFor(b.insurer)}}
  if(resub){const w=b.returned;b.returned=null;setStep(b,'verify');blog(b,'Resubmitted by BU after '+(w?.kind==='reject'?'rejection at approval':'return')+'.')}
  else{setStep(b,'verify');blog(b,'Request submitted: '+b.type+' '+money(b.amount,curOf(b))+' for '+(b.beneficiary||b.cust)+'.')}
  save();ui.draft=null;XF.clear();toast(b.ref+' submitted. The bond team verifies it next.');go('bond',{bond:b.id})};

/* document reading (OCR) via Claude — switched on or off in Settings */
let sampleP=null;
function getSample(){if(!window.claude?.use)return Promise.resolve(null);if(!sampleP)sampleP=window.claude.use('sample').catch(()=>null);return sampleP}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function readDoc(file,maxImgs){
  if((file.type||'').startsWith('image/'))return {text:'',images:maxImgs?[file]:[]};
  if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){
    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
    const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;let text='';const images=[];
    for(let i=1;i<=Math.min(pdf.numPages,25);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();text+=`\n[page ${i}]\n`+tc.items.map(t=>t.str).join(' ');
      if(images.length<maxImgs&&i<=maxImgs){const vp=pg.getViewport({scale:1.5});const cv=document.createElement('canvas');cv.width=vp.width;cv.height=vp.height;await pg.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;images.push(await new Promise(r=>cv.toBlob(r,'image/png')))}}
    return {text:text.slice(0,120000),images}}
  return {text:(await file.text()).slice(0,120000),images:[]}}
const OCR_TENDER=`You extract details for a surety bond (insurance surety bond) request from an Indian tender document, NIT, LoA or bond wording. Return a JSON object with these keys, using null when the document does not state the value:
customer (issuing organisation short name), beneficiary (full legal name in the bond), beneficiary_class ("Public" for PSU/government, else "Private"), project_name, tender_ref, bond_type (one of "Bid Bond","Performance Bond","Advance Bond","Retention Bond","Additional Security Bond"), bond_amount_inr (number in rupees; 1 crore = 10000000, 1 lakh = 100000), contract_value_inr (number), bid_submission_date (YYYY-MM-DD), bid_validity_days (number), additional_days (number), claim_period_days (number), bond_start (YYYY-MM-DD), bond_expiry (YYYY-MM-DD), claim_expiry (YYYY-MM-DD), wording_flags (array of short points the CSO should check in the bond wording), missing (array of what this document does not state), notes (array of other important points).`;
A.ocrPick=async()=>{const f=await pickFiles(false);if(f[0])runTenderOCR(f[0])};
A.ocrSample=async()=>{try{const r=await fetch('SECI_70MW_tender_extract.pdf');if(!r.ok)throw 0;const bl=await r.blob();runTenderOCR(new File([bl],'SECI_70MW_tender_extract.pdf',{type:'application/pdf'}))}catch(e){toast('Could not load the sample tender.',1)}};
async function runTenderOCR(file){
  if(!S.settings.ocr)return toast('Document reading is switched off in Settings.',1);
  const b=ui.draft;let src=file;
  if(isZip(file)){try{const z=await JSZip.loadAsync(file);const names=[];z.forEach((p,e)=>{if(!e.dir&&/\.(pdf|png|jpe?g|webp)$/i.test(p)&&!/__MACOSX/.test(p))names.push(p)});const pick=names.find(n=>DOC_MATCH['Tender document'].test(n.split('/').pop()))||names[0];if(!pick){ui.ocr='There is no PDF or image inside '+esc(file.name)+' to read.';render();return}
    const blob=await z.file(pick).async('blob');const ext=pick.split('.').pop().toLowerCase();src=new File([blob],pick.split('/').pop(),{type:ext==='pdf'?'application/pdf':'image/'+(ext==='jpg'?'jpeg':ext)})}catch(e){ui.ocr='Could not open that zip.';render();return}}
  ui.ocr=`<span class="spin"></span> Reading <b>${esc(src.name)}</b>… Claude may ask you to allow access first.`;render();
  try{let x=null,demo=false;const sample=await getSample();
    if(sample){let maxImgs=0;try{const L=await sample.limits();maxImgs=Math.min(L?.images?.maxCount||0,3)}catch(e){}const doc=await readDoc(src,maxImgs);if(!doc.text.trim()&&!doc.images.length)throw {message:'Nothing readable in that file.'};
      x=await sample.json(OCR_TENDER+`\n\nFile name: ${src.name}\n${doc.images.length?`The first ${doc.images.length} page image(s) are attached.`:''}\nExtracted text:\n"""${doc.text}"""\n\nReturn ONLY the JSON object.`,doc.images.length?{images:doc.images}:{})}
    else{demo=true;x=/SECI/i.test(src.name)?{customer:'SECI',beneficiary:'Solar Energy Corporation of India Limited',beneficiary_class:'Public',project_name:'70 MW ISTS-connected solar PV with 25 MW / 50 MWh BESS at Ramagiri, AP (Package 1) incl. 5-yr O&M',tender_ref:'SECI/C&P/OP/11/0002/26-27',bond_type:'Bid Bond',missing:['EMD amount, bid submission date and bid validity are in the Bid Information Sheet'],notes:['EMD or Bid Securing Declaration accepted; check whether a bond is needed']}:{bond_type:'Bid Bond'}}
    const set=(p,v)=>{if(v!=null&&v!==''){setPath(b,p,v);XF.add(p)}};
    set('cust',x.customer);set('beneficiary',x.beneficiary);set('benClass',x.beneficiary_class);set('project',x.project_name);set('tenderRef',x.tender_ref);
    if(MA('bondTypes').some(t=>t.name===x.bond_type)){b.type=x.bond_type;XF.add('type');typeChanged(b)}
    set('amount',x.bond_amount_inr);set('contractValue',x.contract_value_inr);
    if(x.bid_submission_date)set('period.sub',x.bid_submission_date);if(x.bid_validity_days!=null){b.period.validityMode='days';set('period.validity',x.bid_validity_days)}if(x.additional_days!=null)set('period.add',x.additional_days);if(x.claim_period_days!=null)set('period.claimDays',x.claim_period_days);
    if(b.period.mode==='bid')calcPeriod(b);else{set('start',x.bond_start);set('expiry',x.bond_expiry);set('claim',x.claim_expiry)}
    const tender=b.reqDocs.find(d=>/tender/i.test(d.name));if(tender&&!tender.file){tender.file=fileMeta(file)}
    if((x.notes||[]).length)b.remarks=[b.remarks,...x.notes.map(n=>'• '+n)].filter(Boolean).join('\n');
    const fl=(x.wording_flags||[]).filter(Boolean),ms=(x.missing||[]).filter(Boolean);
    ui.ocr=`<b>${demo?'Demo values (Claude is not available in this view)':'Read from '+esc(src.name)}:</b> ${XF.size} field(s) filled and shown in blue. Check each one before submitting.${fl.length?`<ul>${fl.map(f=>`<li>Wording: ${esc(f)}</li>`).join('')}</ul>`:''}${ms.length?`<ul>${ms.map(f=>`<li>Not in this document: ${esc(f)}</li>`).join('')}</ul>`:''}`;
    keepDraft(b);audit('Bond request','Tender read by Claude',b.ref||'Draft',src.name);
  }catch(e){ui.ocr=`Could not read that file${e?.code==='not_granted'?': access to Claude was declined. Fill the form by hand.':e?.code==='rate_limited'?': too many requests just now. Wait a minute and try again.':'. '+esc(e?.message||'Try a clearer PDF or image.')}`}
  render()}
</script>
<script>

const REG_COLS=[
 {k:'ref',l:'Reference',g:b=>b.ref||'Draft'},
 {k:'co',l:'Created on',g:b=>(b.createdAt||'').slice(0,10),d:1},
 {k:'ro',l:'Requested on',g:b=>(b.requestedAt||'').slice(0,10),d:1},
 {k:'rq',l:'Requestor',g:b=>b.requestor||''},
 {k:'vr',l:'Version',g:b=>verOf(b)},
 {k:'kd',l:'Kind',g:b=>KIND_L[b.kind]||''},
 {k:'st',l:'Status',g:b=>statusL(b)[0]},
 {k:'sp',l:'Step',g:b=>b.status==='open'?(stepIx(b.step)+1)+' · '+STEPS[stepIx(b.step)].l:b.status==='issued'&&b.step==='closure'?'6 · Closure':''},
 {k:'wo',l:'Waiting on',g:b=>{const p=pending(b)[0];return p?WHO_L[p.who]:''}},
 {k:'bu',l:'BU',g:b=>b.bu||''},
 {k:'en',l:'Entity',g:b=>entOf(b.entity)?.code||b.entity||''},
 {k:'ty',l:'Bond type',g:b=>b.type||''},
 {k:'be',l:'Beneficiary',g:b=>b.beneficiary||b.cust||''},
 {k:'am',l:'Amount',g:b=>+b.amount||0,n:1},
 {k:'cu',l:'Currency',g:b=>curOf(b)},
 {k:'in',l:'Insurer',g:b=>b.insurer||''},
 {k:'br',l:'Route',g:b=>b.insurer?(b.broker||'Direct'):''},
 {k:'ex',l:'Expiry',g:b=>b.expiry||'',d:1}];
const REG_CHIPS=[['all','All'],['mine','Waiting on me'],['draft','My drafts'],['open','In progress'],['live','Live'],['closed','Closed']];
const regBase=()=>S.bonds.filter(b=>b.status!=='draft'||b.createdBy===me().id);
const chipPass=(b,c)=>c==='all'?true:c==='mine'?isMine(b):c==='draft'?b.status==='draft':c==='open'?b.status==='open':c==='live'?b.status==='issued':!['draft','open','issued'].includes(b.status);
VIEWS.register=()=>{
  const chip=ui.reg.chip||'all',base=regBase();
  const T=TBL.reg={key:'reg',cols:REG_COLS,rows:()=>regBase().filter(b=>chipPass(b,chip)).sort((a,b)=>(a.requestedAt||a.createdAt)<(b.requestedAt||b.createdAt)?1:-1)};
  const rows=ftRows(T);
  return `<div class="panel"><div class="chips">${REG_CHIPS.map(([k,l])=>`<button class="chip ${chip===k?'on':''}" data-a="regChip" data-c="${k}">${l}<span class="n">${base.filter(b=>chipPass(b,k)).length}</span></button>`).join('')}</div>
    ${ftBar(T,'Reference, beneficiary, project, insurer…',`${can('register','export')?'<button class="btn" data-a="regXl">Export to Excel</button>':''}${can('request','create')?'<button class="btn p" data-go="request">New request</button>':''}`)}
    <p class="mu" style="margin:0">Use ▾ on any column to sort or filter it, like Excel. Click a reference to open the request.</p></div>
  <div class="mu" style="margin-bottom:6px">Showing ${rows.length} of ${T.rows().length}</div>
  <div class="tw"><table><thead><tr>${ftHead(T)}<th class="stk"></th></tr></thead><tbody>${rows.map(b=>{const p=pending(b)[0];return `<tr>
   <td class="w"><button class="btn link" data-a="openBond" data-id="${b.id}">${esc(b.ref||'Draft')}</button>${slaPill(b)}${b.final?.bondNo?`<div class="mu" style="font-size:.8rem">Bond no. ${esc(b.final.bondNo)}</div>`:''}</td><td class="w">${fd(b.createdAt)}</td><td class="w">${b.requestedAt?fd(b.requestedAt):'—'}</td><td>${esc(b.requestor||'')}</td>
   <td class="w"><button class="btn link" data-a="verOpen" data-id="${b.id}">${esc(verOf(b))}</button></td><td>${esc(KIND_L[b.kind]||'')}</td><td>${statusPill(b)}</td><td class="w">${esc(REG_COLS[7].g(b))}</td>
   <td>${p?`${esc(WHO_L[p.who])}${isMine(b)?' '+pill('You','ac'):''}<div class="mu">${esc(p.text)}</div>`:''}</td>
   <td>${esc(b.bu||'')}</td><td>${esc(REG_COLS[10].g(b))}</td><td class="w">${esc(b.type||'')}</td><td style="min-width:170px">${esc(b.beneficiary||b.cust||'')}</td><td class="n w">${money(b.amount,curOf(b))}</td><td>${esc(curOf(b))}</td><td>${esc(b.insurer||'')}</td><td>${esc(REG_COLS[16].g(b))}</td><td class="w">${fd(b.expiry)}</td><td class="w">${esc(b.final?.bondNo||'')}</td>
   <td class="stk"><button class="btn sm" data-a="openBond" data-id="${b.id}">Open</button></td></tr>`}).join('')||`<tr><td colspan="20" class="empty">No requests match. Clear the filters or pick another tab.</td></tr>`}</tbody></table></div>`};
A.regChip=el=>{ui.reg.chip=el.dataset.c;render()};
A.regXl=()=>{const rows=ftRows(TBL.reg);xlsxOut('Bond_register_'+TODAY+'.xlsx',[['Bond register',[[...REG_COLS.map(c=>c.l),'Project','Tender ref','Start','Claim expiry','Bond number','Premium (PI)','UTR'],...rows.map(b=>[...REG_COLS.map(c=>c.k==='am'?+b.amount||0:c.g(b)),b.project||'',b.tenderRef||'',b.start||'',b.claim||'',b.final?.bondNo||'',b.pi?.premium??'',b.payment?.utr||''])]]])};
A.verOpen=el=>{const b=bond(el.dataset.id),p=b.kind==='new'?b:bond(b.parentId);const v=(p?.versions||[]);const kids=S.bonds.filter(x=>x.parentId===p?.id);

  ${kids.length?`<h3 style="margin-top:14px">Change requests</h3>${tbl('<th>Reference</th><th>Kind</th><th>Status</th>',kids.map(k=>`<tr><td><button class="btn link" data-a="openBondM" data-id="${k.id}">${esc(k.ref||'Draft')}</button></td><td>${KIND_L[k.kind]}</td><td>${statusPill(k)}</td></tr>`).join(''))}`:''}
  <div class="foot"><button class="btn p" data-a="closeModal">Close</button></div>`)};
A.openBondM=el=>{closeModal();openBond(el.dataset.id)};

/* ============ bond detail ============ */
VIEWS.bond=()=>{const b=bond(ui.bond),p=pending(b),c=curOf(b),par=b.parentId?bond(b.parentId):null;
  const head=`<div class="panel"><div class="facts"><div><span>Created on</span><b>${fdt(b.createdAt)}</b></div><div><span>Requested on</span><b>${b.requestedAt?fdt(b.requestedAt):'—'}</b></div><div><span>Requestor</span><b>${esc(b.requestor||'—')}</b></div><div><span>Bond version</span><b><button class="btn link" data-a="verOpen" data-id="${b.id}">${esc(verOf(b))}</button></b></div>
    <div><span>Status</span><b>${statusPill(b)}${slaPill(b)}</b></div><div><span>Amount</span><b>${money(b.amount,c)}</b></div><div><span>${b.kind==='new'?'Bond type':'Changes'}</span><b>${b.kind==='new'?esc(b.type):esc(KIND_L[b.kind])+' of <button class="btn link" data-a="openBond" data-id="'+par?.id+'">'+esc(par?.ref||'')+'</button>'}</b></div><div><span>Waiting on</span><b>${p.length?p.map(x=>esc(WHO_L[x.who])+(mineWho(b,x.who)?' (you)':'')).join(', '):'—'}</b></div></div>
    ${b.status==='open'||b.step==='closure'?`<div style="margin-top:16px">${stepper(b.step)}</div>`:''}</div>`;
  let main='';
  if(b.status==='open'){main=({request:stRequest,verify:stVerify,approval:stApproval,placement:stPlacement,issue:stIssue}[b.step]||(()=>''))(b)}
  if(b.status==='issued'&&b.step==='closure')main=stClosure(b);
  if(b.status==='issued'&&b.kind==='new')main+=stLife(b);
  if(b.status==='draft')main=`<div class="panel"><p>This request is still a draft.</p>${isMaker(b)?'<button class="btn p" data-a="editReq" data-id="'+b.id+'">Continue the draft</button>':''}</div>`;
  if(['withdrawn','rejected','cancelled','expired','released'].includes(b.status))main+=`<div class="note ${b.status==='expired'?'i':'w'}">${esc(statusL(b)[0])}${b.closeReason?' · '+esc(b.closeReason):''}${b.release?` · ${esc(b.release.reason)} on ${fd(b.release.date)}`:''}</div>`;
  const withdraw=b.status==='open'&&!b.payment&&isMaker(b)?`<button class="btn d sm" data-a="withdraw">Withdraw request</button>`:'';
  return head+main+moneyPanel(b)+details(b)+docsPanel(b)+docLog(b)+commPanel(b)+bondHistory(b)+(withdraw?`<div class="row" style="justify-content:flex-end">${withdraw}</div>`:'')};
const subBox=(k,title,state,body,right)=>`<div class="sub ${state}"><div class="sub-h"><span class="k">${state==='done'?'✓':k}</span><b>${title}</b><span class="sp"></span>${right||''}</div>${state==='lock'?'':`<div class="sub-b">${body}</div>`}</div>`;
const actPanel=(title,body,who)=>`<div class="panel"><div class="row c" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${title}</h2>${who?`<span class="mu">${who}</span>`:''}</div>${body}</div>`;

/* Step 1 returned */
function stRequest(b){const r=b.returned||{};return actPanel('Step 1 · Returned to BU',`<div class="note w"><b>${r.kind==='reject'?'Rejected at internal approval':'Sent back'} by ${esc(r.by||'')} on ${fdt(r.at)}.</b> ${esc(r.comment||'')}</div>${isMaker(b)?'<button class="btn p" data-a="editReq" data-id="'+b.id+'">Edit and resubmit</button>':'<p class="mu">Waiting for the BU to revise and resubmit.</p>'}`,'Owner: BU (maker)')}
A.editReq=el=>{ui.draft=bond(el.dataset.id);ui.reqErr=null;XF.clear();go('request')};

/* Step 2 */
function docTable(b,pack,slots,editable){
  const r=openReq(b,pack),req=r&&!r.submittedAt?r.docs:null,mk=isMaker(b),team=can('verify','edit');
  return tbl(`<th>Document</th>${pack==='insurer'?'<th>Owner</th>':'<th>Required</th>'}<th>File</th><th>Remarks</th><th></th>`,slots.map((d,i)=>{const asked=req&&req.includes(d.name);const canUp=editable&&(team||(mk&&(asked||pack==='insurer')));
    return `<tr${asked?' style="background:var(--was)"':''}><td><b>${esc(d.name)}</b>${asked?' '+pill('Requested','wa'):''}</td><td>${pack==='insurer'?esc(d.owner||''):d.mandatory?pill('Mandatory','wa'):pill('Optional','gr')}</td><td>${fileChip(d.file)}${d.file?.at?`<div class="mu">${fdt(d.file.at)} · ${esc(d.file.by||'')}</div>`:''}</td><td>${esc(d.remark||'')}</td>
    <td>${canUp?`<button class="btn sm" data-a="docUp" data-p="${pack}" data-i="${i}">${d.file?'Replace':'Upload'}</button>`:''}</td></tr>`}).join(''))}
function stVerify(b){
  const team=can('verify','edit'),mk=isMaker(b),rq=openReq(b,'request'),ri=openReq(b,'insurer'),aOK=!!b.verify?.docsOk,bOK=!!b.insurer,cOK=!!b.insPackOk,dOK=!!b.quote;
  const reqNote=r=>r?(r.submittedAt?`<div class="note i">BU sent the requested documents on ${fdt(r.submittedAt)} (${esc(r.submittedBy)}). Check them and accept, or ask again.</div>`:`<div class="note w"><b>Waiting for BU:</b> ${r.docs.map(esc).join(', ')}. Asked by ${esc(r.by)} on ${fdt(r.at)}.${r.comment?' “'+esc(r.comment)+'”':''}${mk?'<div style="margin-top:6px">Upload each requested document, then send them back.</div>':''}</div>`):'';
  const respBtn=(r,pack)=>r&&!r.submittedAt&&(mk||team)?`<button class="btn p" data-a="reqSubmit" data-p="${pack}" ${r.docs.every(n=>((pack==='request'?b.reqDocs:b.insDocs)||[]).find(d=>d.name===n&&d.file&&d.file.at>r.at))?'':'disabled'}>Send documents to bond team</button>`:'';
  /* a: request documents */
  const a=subBox('a','Verify request documents',aOK?'done':'cur',`${reqNote(rq)}${docTable(b,'request',b.reqDocs||[],!aOK)}
    <div class="acts" style="margin-top:10px">${respBtn(rq,'request')}${team&&!aOK&&!(rq&&!rq.submittedAt)?`<button class="btn p" data-a="docsOk">Documents complete · accept</button><button class="btn" data-a="askDocs" data-p="request">Ask BU for documents</button>`:''}${aOK?`<span class="mu">Accepted by ${esc(b.verify.by)} on ${fdt(b.verify.at)}</span>`:''}</div>`);
  /* b: limit + insurer */
  let bb='';
  if(b.insurer){const u=util(b.insurer),after=u.avail-(b.kind==='new'?+b.amount||0:0);bb=`<div class="kv"><div><span>Insurer</span><b>${esc(b.insurer)}</b></div><div><span>Route</span><b>${esc(b.broker||'Direct')}</b></div><div><span>Available line</span><b>${money(u.avail,u.c)}</b></div><div><span>After this bond</span><b style="color:${after<0?'var(--er)':'inherit'}">${money(after,u.c)}</b></div></div>${after<0?'<div class="note w">Over the recorded line. This is a warning only; record the insurer\'s confirmation in the remarks.</div>':''}
    ${team&&b.kind==='new'?'<button class="btn" data-a="chgIns">Change insurer</button>':''}${pgLine(b,team)}`}
  else if(aOK){const c=curOf(b);const list=MA('insurers').filter(i=>(i.currency||'INR')===c).map(i=>({i,u:util(i.name),ok:!i.types?.length||i.types.includes(b.type)})).sort((x,y)=>(y.ok-x.ok)||(y.u.avail-x.u.avail));
    bb=`<p class="mu" style="margin:0 0 8px">Insurers in ${esc(c)} with their free line. Pick one and the route (Direct or via a broker).</p>${tbl('<th>Insurer</th><th>Takes '+esc(b.type)+'</th><th class="n">Line</th><th class="n">Used</th><th class="n">Pipeline</th><th class="n">Free</th><th class="n">Free after this</th><th></th>',list.map(({i,u,ok})=>{const af=u.avail-(+b.amount||0);return `<tr><td><b>${esc(i.name)}</b><div class="mu">${esc(i.kind||'')}</div></td><td>${ok?pill('Yes','ok'):pill('No','gr')}</td><td class="n">${money(u.lim,c)}</td><td class="n">${money(u.used,c)}</td><td class="n">${money(u.pipe,c)}</td><td class="n">${money(u.avail,c)}</td><td class="n" style="color:${af<0?'var(--er)':'inherit'}">${money(af,c)}${af<0?'<div class="mu">over line</div>':''}</td><td>${team?`<button class="btn sm ${ok?'p':''}" data-a="pickIns" data-n="${esc(i.name)}">Select</button>`:''}</td></tr>`}).join(''),'No insurer is set up in this currency. Add one in Masters.')}`}
  const bx=subBox('b','Limit check · insurer and route',bOK?'done':aOK?'cur':'lock',bb);
  /* c: insurer pack */
  const cc=subBox('c','Insurer document pack'+(b.insurer?' · '+esc(b.insurer):''),cOK?'done':bOK?'cur':'lock',`${reqNote(ri)}${(b.insDocs||[]).length?docTable(b,'insurer',b.insDocs,!cOK):`<p class="mu">No document pack is set up for ${esc(b.insurer)}. Add documents here, or set the pack up in Masters → Insurer document pack.</p>`}
    <div class="acts" style="margin-top:10px">${respBtn(ri,'insurer')}${!cOK&&(team||mk)?'<button class="btn" data-a="packZip">Upload zip or several files</button>':''}${team&&!cOK?'<button class="btn" data-a="addInsDoc">Add a document</button><button class="btn" data-a="askDocs" data-p="insurer">Ask BU for documents</button><button class="btn p" data-a="packOk">Accept pack</button>':''}${cOK?`<span class="mu">Accepted by ${esc(b.insPackOk.by)} on ${fdt(b.insPackOk.at)}</span>`:''}</div>`);
  /* d: quote */
  const q=b.quote||{},prem=q.premium??'';
  const dd=subBox('d','Insurer quote',dOK&&b.step!=='verify'?'done':cOK?'cur':'lock',team?`<div class="grid">${fld('Premium rate (%) <span class="req">*</span>',`<input type="number" id="qRate" step="any" min="0" value="${esc(q.rate??'')}" data-in="qRate">`,'Of the bond amount')}${fld('Quoted premium ('+CUR(curOf(b)).symbol+', before GST) <span class="req">*</span>',`<input type="number" id="qPrem" step="any" min="0" value="${esc(prem)}">`)}${fld('Quote date',`<input type="date" id="qDate" value="${esc(q.date||TODAY)}">`)}${fld('Remarks',`<input id="qRm" value="${esc(q.remarks||'')}">`)}</div>
    <div class="acts" style="margin-top:10px"><button class="btn p" data-a="sendApproval" ${aOK&&bOK&&cOK?'':'disabled'}>${buildChain(b)?'Send for internal approval':'Move to PI and payment'}</button><span class="mu">Approval: ${esc(bandLabel(b))}</span></div>`:`<p class="mu">${q.rate!=null?'Quoted '+q.rate+'% = '+full(q.premium,curOf(b))+' + GST':'Bond team records the quote.'}</p>`);
  return actPanel('Step 2 · Verification and quotation',a+bx+cc+dd,'Owner: Bond team')}
function bandLabel(b){const band=bandFor(b);if(!band)return 'Any approver';const r=ACCESS.roles.find(x=>x.id===band.role);return (r?r.name:'Approver')+(band.label?' · '+band.label:'')}
CH.qRate=el=>{const b=bond(ui.bond),r=+el.value;if(r>=0&&b.amount)$('#qPrem').value=Math.round((+b.amount)*r/100)};
A.docUp=async el=>{const b=bond(ui.bond),pack=el.dataset.p,slots=pack==='request'?b.reqDocs:b.insDocs,s=slots[+el.dataset.i];const f=await pickFiles(false);if(!f.length)return;s.file=fileMeta(f[0]);s.remark='';
  if(isZip(f[0])){const c=await zipList(f[0]);if(c)s.file.contents=c}
  const r=openReq(b,pack);if(r&&!r.submittedAt&&r.docs.includes(s.name))r.responses.push({doc:s.name,file:f[0].name,at:now(),by:me().name});
  blog(b,(pack==='request'?'Request':'Insurer pack')+' document uploaded: '+s.name+' ('+f[0].name+').');save();render()};
A.packZip=async()=>{const b=bond(ui.bond);const f=await pickFiles(true);if(!f.length)return;const r=openReq(b,'insurer');const hit=await fillSlots(b.insDocs,f,r&&!r.submittedAt&&!can('verify','edit')?r.docs:null);
  if(r&&!r.submittedAt)hit.filter(n=>r.docs.includes(n)).forEach(n=>r.responses.push({doc:n,file:(b.insDocs.find(d=>d.name===n).file||{}).name,at:now(),by:me().name}));
  if(hit.length)blog(b,'Insurer pack upload: '+hit.join(', ')+'.');save();render();toast(hit.length?'Matched '+hit.length+': '+hit.join(', '):'No file name matched the pack. Use Upload on each row.',!hit.length)};
A.addInsDoc=()=>{ui.modal={kind:'insdoc'};modal(`<h2>Add a document to the insurer pack</h2>${fld('Document name <span class="req">*</span>','<input id="idName">')}${fld('Owner','<input id="idOwner" value="BU">')}<div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="addInsDocGo">Add</button></div>`)};
A.addInsDocGo=()=>{const b=bond(ui.bond),n=val('idName');if(!n)return toast('Enter a document name.',1);b.insDocs=b.insDocs||[];b.insDocs.push({name:n,owner:val('idOwner'),file:null,remark:''});closeModal();blog(b,'Document added to insurer pack: '+n+'.');save();render()};
A.askDocs=el=>{const b=bond(ui.bond),pack=el.dataset.p,slots=(pack==='request'?b.reqDocs:b.insDocs)||[];ui.modal={kind:'ask',pack};
  modal(`<h2>Ask BU for documents</h2><p class="lead">Tick only the documents you need. The BU sees just these and can respond to them without resending everything.</p>
  <div class="fl" style="max-height:260px">${slots.map((d,i)=>`<label class="ck"><input type="checkbox" value="${esc(d.name)}" ${!d.file&&d.mandatory!==false?'checked':''}> ${esc(d.name)} ${d.file?'<span class="mu">· has '+esc(d.file.name)+'</span>':'<span class="mu">· missing</span>'}</label>`).join('')}</div>
  ${fld('Another document not in the list','<input id="askOther" placeholder="e.g. Signed proposal form on letterhead">')}${fld('Message to BU','<textarea id="askMsg" placeholder="What is wrong or missing"></textarea>')}
  <div class="foot"><button class="btn" data-a="closeModal">Back</button><button class="btn p" data-a="askDocsGo">Send request</button></div>`)};
A.askDocsGo=()=>{const b=bond(ui.bond),pack=ui.modal.pack,slots=pack==='request'?b.reqDocs:b.insDocs;const docs=$$('#modal-root .fl input:checked').map(x=>x.value),o=val('askOther');
  if(o){docs.push(o);if(!slots.find(d=>d.name===o))slots.push({name:o,mandatory:true,owner:'BU',file:null,remark:'',extra:true})}
  if(!docs.length)return toast('Tick at least one document.',1);
  (b.docReqs||[]).filter(r=>!r.closedAt&&r.pack===pack).forEach(r=>{r.closedAt=now();r.closedBy=me().name;r.outcome='Replaced by a new request'});
  b.docReqs=b.docReqs||[];b.docReqs.push({id:uid('r'),pack,docs,at:now(),by:me().name,comment:val('askMsg'),responses:[]});
  if(pack==='request'&&b.verify)b.verify.docsOk=false;if(pack==='insurer')b.insPackOk=null;
  closeModal();blog(b,'Asked BU for '+(pack==='request'?'request':'insurer pack')+' documents: '+docs.join(', ')+(val('askMsg')?'. '+val('askMsg'):'')+'.');save();render();toast('Request sent to the BU.')};

/* Step 3 */

  const body=`<div class="kv"><div><span>Bond</span><b>${esc(b.type)} · ${money(b.amount,c)}</b></div><div><span>Beneficiary</span><b>${esc(b.beneficiary)}</b></div><div><span>Insurer and route</span><b>${esc(b.insurer)} · ${esc(b.broker||'Direct')}</b></div><div><span>Quote</span><b>${b.quote?.rate}% · ${full(b.quote?.premium,c)} + GST</b></div><div><span>Period</span><b>${fd(b.start)} → ${fd(b.expiry)}</b></div><div><span>Approver</span><b>${esc(bandLabel(b))}</b></div></div>

/* Step 4 */
function stPlacement(b){const c=curOf(b),team=can('placement','edit'),fin=can('payment','edit'),mk=isMaker(b),pi=b.pi,v=piVar(b),gst=+S.settings.gst||18;
  const piForm=`<div class="note i">Reading the PI automatically (OCR) and the OMS link are Phase 2. Enter the figures from the PI here.</div><div class="grid">
    ${fld('PI number <span class="req">*</span>',`<input id="piNo" data-in="piCalc" value="${esc(pi?.no||'')}">`)}${fld('PI date',`<input type="date" id="piDate" data-in="piCalc" value="${esc(pi?.date||TODAY)}">`)}
    ${fld('Premium before GST <span class="req">*</span>',`<input type="number" id="piPrem" step="any" min="0" value="${esc(pi?.premium??b.quote?.premium??'')}" data-in="piCalc">`,'Quoted: '+full(b.quote?.premium,c))}
    ${fld('GST ('+gst+'%)',`<input type="number" id="piGst" step="any" min="0" value="${esc(pi?.gst??'')}" data-in="piCalc">`,'Filled at '+gst+'%; edit to match the PI')}
    ${fld('Stamp paper cost',`<input type="number" id="piStamp" step="any" min="0" value="${esc(pi?.stamp??'')}" data-in="piCalc">`,'Entered by hand')}
    ${fld('PI total',`<input id="piTot" readonly value="${pi?full(pi.total,c):''}">`)}</div>
    <label class="ck" style="margin-top:8px"><input type="checkbox" id="piGstin" data-in="piCalc" ${pi?.gstinOk?'checked':''}> PI shows the Zetwerk GSTIN (${esc(S.settings.gstin||'')})</label>
    <div class="acts" style="margin-top:10px"><button class="btn" data-a="piFile">${pi?.file?'Replace PI file':'Attach PI file'}</button>${ui.piFile||pi?.file?fileChip(ui.piFile||pi.file):''}<button class="btn p" data-a="piSave">Save PI</button>${pi?'<button class="btn" data-a="piCancel">Cancel</button>':''}</div><div id="piPrev" style="margin-top:14px"></div>`;
  const piView=pi?`<div class="kv"><div><span>PI</span><b>${esc(pi.no)} · ${fd(pi.date)}</b></div><div><span>Premium</span><b>${full(pi.premium,c)}</b></div><div><span>GST</span><b>${full(pi.gst,c)}</b></div><div><span>Stamp paper</span><b>${full(pi.stamp||0,c)}</b></div><div><span>Total</span><b>${full(pi.total,c)}</b></div><div><span>File</span><b>${fileChip(pi.file)}</b></div></div>
    <div class="note ${v.over?(pi.accepted?'i':'w'):'o'}">Quoted ${full(b.quote?.premium,c)} · PI ${full(pi.premium,c)} · difference ${full(v.diff,c)} (${v.pct.toFixed(2)}%), tolerance ${S.settings.premTol}%. ${v.over?(pi.accepted?'Variance accepted by '+esc(pi.accepted.by)+': '+esc(pi.accepted.reason):'Outside tolerance: Finance or the bond team must accept it before payment.'):'Within tolerance.'}${pi.gstinOk?'':' Zetwerk GSTIN not confirmed on the PI.'}</div>
    <div class="acts"><button class="btn sm" data-a="piPrevOpen">View PI</button>${team&&!b.payment?'<button class="btn sm" data-a="piEdit">Edit PI</button>':''}${v.over&&!pi.accepted&&(fin||team)?'<button class="btn sm p" data-a="piAccept">Accept variance</button>':''}</div>`:'';
  const a=subBox('a','Proforma invoice (PI) and premium check',pi&&(!v.over||pi.accepted)?'done':'cur',pi&&!ui.piEdit?piView:team?piForm:'<p class="mu">Bond team enters the PI.</p>');
  const d=b.draft||{};
  const bx=subBox('b','Draft bond and BU confirmation',d.confirmed?'done':'cur',`${d.file?`<div class="kv"><div><span>Draft bond</span><b>${fileChip(d.file)}</b></div><div><span>Uploaded</span><b>${fdt(d.file.at)} · ${esc(d.file.by)}</b></div>${d.confirmed?`<div><span>Confirmed by BU</span><b>${fdt(d.confirmed.at)} · ${esc(d.confirmed.by)}</b></div>`:''}</div>`:'<p class="mu" style="margin:0 0 8px">No draft bond uploaded yet.</p>'}
    ${d.changeReq?`<div class="note w">BU asked for changes: ${esc(d.changeReq.comment)} (${fdt(d.changeReq.at)})</div>`:''}
    <div class="acts">${team&&!d.confirmed?`<button class="btn ${d.file?'':'p'}" data-a="draftUp">${d.file?'Replace draft':'Upload draft bond'}</button>`:''}${mk&&d.file&&!d.confirmed&&!d.changeReq?'<button class="btn p" data-a="draftOk">Confirm draft wording</button><button class="btn" data-a="draftChg">Ask for changes</button>':''}</div>`);
  const pay=b.payment;
  const cx=subBox('c','Payment in OMS · UTR and bank details',pay?'done':pi&&(!v.over||pi.accepted)?'cur':'lock',pay?payView(b):fin?payForm(b):'<p class="mu">Finance records the payment.</p>');
  const ready=pi&&(!v.over||pi.accepted)&&d.confirmed&&pay;
  return actPanel('Step 4 · Placement and payment',a+bx+cx+(ready&&can('issue','edit')?'<button class="btn p" data-a="toIssue">Move to bond issuance</button>':''),'Owners: Bond team · BU · Finance')}
CH.piCalc=el=>{const p=+$('#piPrem').value||0;if(el.id==='piPrem')$('#piGst').value=Math.round(p*(+S.settings.gst||18))/100;const t=p+(+$('#piGst').value||0)+(+$('#piStamp').value||0);$('#piTot').value=full(t,curOf(bond(ui.bond)))};

/* Step 5 */
function stIssue(b){if(!can('issue','edit'))return actPanel('Step 5 · Bond issued','<p class="mu">Waiting for the bond team to upload the final bond.</p>');const ch=b.kind!=='new'?(b.changes||{}):{};
  return actPanel('Step 5 · Bond issued',`<div class="note i">Upload the final ${b.kind==='new'?'bond':'endorsement'} and enter its details. Reading these from the PDF automatically is Phase 2.</div>
   <div class="grid">${fld(b.kind==='new'?'Bond number <span class="req">*</span>':'Endorsement number <span class="req">*</span>','<input id="fnNo">')}${fld('Insurer / policy reference','<input id="fnRef">')}
   ${fld('Start date',`<input type="date" id="fnStart" value="${esc(b.start||'')}">`)}${fld('Expiry date <span class="req">*</span>',`<input type="date" id="fnExp" value="${esc(ch.expiry||b.expiry||'')}">`)}${fld('Claim-expiry date',`<input type="date" id="fnClaim" value="${esc(ch.claim||b.claim||'')}">`)}</div>
   <div class="acts" style="margin-top:10px"><button class="btn" data-a="fnFile">${ui.fnFile?'Replace file':'Attach final '+(b.kind==='new'?'bond':'endorsement')+' <span class="req">*</span>'}</button>${ui.fnFile?fileChip(ui.fnFile):''}<button class="btn p" data-a="issueGo">Mark as issued</button></div>`,'Owner: Bond team')}
A.fnFile=async()=>{const f=await pickFiles(false);if(f[0]){ui.fnFile=fileMeta(f[0]);const v={no:val('fnNo'),ref:val('fnRef'),s:val('fnStart'),e:val('fnExp'),c:val('fnClaim')};render();$('#fnNo').value=v.no;$('#fnRef').value=v.ref;$('#fnStart').value=v.s;$('#fnExp').value=v.e;$('#fnClaim').value=v.c}};
A.issueGo=()=>{const b=bond(ui.bond),no=val('fnNo'),exp=val('fnExp');if(!ui.fnFile)return toast('Attach the final bond file.',1);if(!no||!exp)return toast('Enter the number and expiry date.',1);
  b.final={file:ui.fnFile,bondNo:no,insRef:val('fnRef'),start:val('fnStart'),expiry:exp,claim:val('fnClaim'),at:now(),by:me().name};ui.fnFile=null;
  if(b.kind==='new'){b.start=b.final.start||b.start;b.expiry=exp;b.claim=b.final.claim||b.claim;b.status='issued';b.version=1;b.versions=[{v:1,at:now(),by:me().name,change:'Bond issued · '+no,ref:b.ref}];b.reqStatus='Issued';
    const u=util(b.insurer);if(u.avail<0)b.overLimit=true;blog(b,'Bond issued: '+no+'. Limit utilised on '+b.insurer+'.','Issuance')}
  else{const p=bond(b.parentId),ch=b.changes||{},parts=[];
    if(p){if(exp&&exp!==p.expiry){parts.push('expiry '+fd(p.expiry)+' → '+fd(exp));p.expiry=exp}const cl=b.final.claim||ch.claim;if(cl&&cl!==p.claim){parts.push('claim expiry '+fd(p.claim)+' → '+fd(cl));p.claim=cl}
      if(ch.amount!=null&&+ch.amount!==+p.amount){parts.push('amount '+money(p.amount,curOf(p))+' → '+money(ch.amount,curOf(p)));p.amount=+ch.amount}if(ch.beneficiary&&ch.beneficiary!==p.beneficiary){parts.push('beneficiary changed');p.beneficiary=ch.beneficiary}if(ch.wording)parts.push('wording changed');
      p.version=(p.version||1)+1;(p.versions=p.versions||[]).push({v:p.version,at:now(),by:me().name,change:KIND_L[b.kind]+': '+(parts.join('; ')||'endorsed'),ref:b.ref});if(b.kind==='ext')p.reqStatus='Extended';
      blog(p,KIND_L[b.kind]+' endorsed ('+b.ref+'): '+(parts.join('; ')||'no field change')+'. Now V'+p.version+'.','Issuance')}
    b.status='issued';b.producedVersion=p?.version;blog(b,'Endorsement issued: '+no+'.','Issuance')}
  setStep(b,'closure');save();render();toast('Issued. Last step: upload the tax invoice.')};

/* Step 6 */
function stClosure(b){if(!can('issue','edit'))return actPanel('Step 6 · Closure','<p class="mu">Waiting for the bond team to upload the tax invoice.</p>');

   <div class="acts" style="margin-top:10px"><button class="btn" data-a="tiFile">${ui.tiFile?'Replace file':'Attach tax invoice'}</button>${ui.tiFile?fileChip(ui.tiFile):''}<button class="btn p" data-a="closeGo">Close the request</button></div><p class="mu" style="margin:8px 0 0">After closure, expiry, claim-expiry and return are still tracked on the bond.</p>`,'Owner: Bond team')}

   ${kids.length?`<p class="mu">Change requests: ${kids.map(k=>`<button class="btn link" data-a="openBond" data-id="${k.id}">${esc(k.ref||'Draft')}</button> (${esc(statusL(k)[0])})`).join(', ')}</p>`:''}
   ${act?`<div class="acts">${can('lifecycle','create')?'<button class="btn" data-a="raise" data-k="ext">Raise extension</button><button class="btn" data-a="raise" data-k="amd">Raise amendment</button>':''}${can('lifecycle','edit')||can('issue','edit')?`<button class="btn" data-a="relOpen">Record return / cancellation</button>${inv&&inv.status!=='closed'?'<button class="btn" data-a="invClose">Record invocation outcome</button>':'<button class="btn d" data-a="invOpen">Record invocation</button>'}<button class="btn" data-a="markExp">Mark expired</button>`:''}</div>`:''}`,'')}
A.raise=el=>{const p=bond(ui.bond),k=el.dataset.k;if(S.bonds.some(x=>x.parentId===p.id&&x.status==='open'&&x.kind===k))return toast('An '+KIND_L[k].toLowerCase()+' for this bond is already in progress.',1);

  ui.draft=b;ui.reqErr=null;XF.clear();go('request')};
A.relOpen=()=>{const b=bond(ui.bond);if(b.invocation&&b.invocation.status!=='closed')return toast('Record the invocation outcome before returning this bond.',1);ui.modal={kind:'rel'};
  modal(`<h2>Return or cancel ${esc(b.ref)}</h2><p class="lead">The limit on ${esc(b.insurer)} is restored automatically once this is recorded.</p><div class="grid">${fld('Type','<select id="rlType"><option>Returned</option><option>Cancelled</option></select>')}${fld('Effective date <span class="req">*</span>',`<input type="date" id="rlDate" value="${TODAY}">`)}${fld('Reason <span class="req">*</span>','<textarea id="rlWhy"></textarea>','','full')}</div>

/* ============ match uploaded files to checklist documents (names do not need to match) ============ */
async function mapFiles(title,slots,files,only,onDone){
  const cands=[];
  for(const f of files){
    if(isZip(f)){try{const z=await JSZip.loadAsync(f);z.forEach((p,e)=>{if(!e.dir&&!/(^|\/)(__MACOSX|\.DS_Store)/.test(p))cands.push({name:p.split('/').pop(),label:p.split('/').pop()+'  (in '+f.name+')',from:f.name,get:()=>z.file(p).async('blob')})})}catch(e){toast('Could not open '+f.name,1)}
      cands.push({name:f.name,label:f.name+'  (whole zip)',whole:true,get:async()=>f})}
    else cands.push({name:f.name,label:f.name,get:async()=>f})}
  if(!cands.length)return;
  const targets=slots.map((s,i)=>({s,i})).filter(x=>!only||only.includes(x.s.name)),used=new Set(),pick={};
  targets.forEach(({s,i})=>{const k=cands.findIndex((c,j)=>!used.has(j)&&!c.whole&&matchDoc(s.name,[c.name]).length);if(k>=0){pick[i]=k;used.add(k)}});
  targets.forEach(({s,i})=>{if(pick[i]!=null||s.file)return;const k=cands.findIndex((c,j)=>!used.has(j)&&!c.whole);if(k>=0){pick[i]=k;used.add(k)}});
  ui.modal={kind:'map',slots,cands,targets,onDone};

  a.status='approved';a.at=now();(b.approvals=b.approvals||[]).push(clone(a));setStep(b,'placement');blog(b,'Approved at '+l.label+' by '+u.name+(cm?': '+cm:'')+'. All approval levels complete.','Approval');save();render();toast('Approved. Next: PI, draft bond and payment.')};

  b.returned={kind:'reject',at:now(),by:u.name,comment:cm};setStep(b,'request');blog(b,'Rejected at '+l.label+' by '+u.name+' and returned to BU: '+cm+'.','Approval');save();render();toast('Returned to the BU with your comment.')};

     <td><div class="acts" style="flex-wrap:nowrap">${ed?`<button class="btn sm" data-a="wfEdit" data-id="${w.id}">Edit</button><button class="btn sm d" data-a="wfDel" data-id="${w.id}">Delete</button>`:''}</div></td></tr>`).join(''),'No workflows yet, so no BU needs approval.')}
   <h3 style="margin:14px 0 6px">Business units</h3><div class="chips">${covered.map(x=>`<span class="chip" style="cursor:default" title="${x.w.length?'Approval: '+esc(x.w.map(w=>w.name).join(', ')):'No approval'}">${x.w.length?'✓':'—'} ${esc(x.n)}</span>`).join('')}</div><p class="mu" style="margin:0">✓ needs approval · — goes straight to PI and payment.</p>`}</div>`}

<script>

(()=>{const drop=['payee','payBank','payAcc','payIfsc'];MDEF.insurers.f=MDEF.insurers.f.filter(f=>!drop.includes(f[0]));

    used:r=>S.bonds.filter(b=>b.payment?.from?.account===r.account||b.payment?.payee?.account===r.account).length};
  const E=Object.entries(MDEF).filter(([k])=>k!=='banks');Object.keys(MDEF).forEach(k=>delete MDEF[k]);E.forEach(([k,v])=>{MDEF[k]=v;if(k==='geos')MDEF.accounts=ac});if(!MDEF.accounts)MDEF.accounts=ac;
  if(ui.mst==='banks')ui.mst='accounts'})();
function ensureAccts(){if(!S||S.settings.acctSeeded)return;S.settings.acctSeeded=true;const L=S.m.accounts=S.m.accounts||[],add=o=>{if(o.account&&!L.some(x=>x.account===o.account&&x.party===o.party))L.push({id:uid('m'),branch:'',ifsc:'',currency:'',active:true,createdAt:now(),createdBy:'Migration',...o})};
  M('banks').forEach(x=>add({account:x.account,partyType:'Our entity',party:x.entity||'',payee:x.entity||'Zetwerk',bank:x.bank,branch:x.branch||'',ifsc:x.ifsc||'',isDefault:true}));

/* accounts inside the entity / insurer / broker form */

  ui.modal.accts=name?clone(M('accounts').filter(x=>x.partyType===type&&x.party===name)):[];ui.modal.acType=type;ui.modal.acParty=name;

  <button class="btn sm" data-a="acAdd" style="margin-top:8px">Add bank account</button>`}

/* payment step: our entity's accounts → insurer's or broker's accounts */
payForm=function(b){const c=curOf(b),L=acctsOf('Our entity',b.entity),P=[...acctsOf('Insurer',b.insurer).map(x=>[x,'Insurer']),...(b.broker&&b.broker!=='Direct'?acctsOf('Broker',b.broker).map(x=>[x,'Broker']):[])];

const GSTIN_RE=/\b\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]\b/g;

    bank_name:g(/(?:Name Address of Bank|Beneficiary Bank|Bank Name)\s*[:\-]*\s*(.+?)(?=\s+(?:Bank Branch|Beneficiary|Account|IFSC|Branch|PAN|MICR)|$)/i),

async function docText(file,maxImgs){

/* returns {data, via} where via is 'claude' | 'rules' | 'ocr+rules' */
async function readFields(file,prompt,ruleFn,onStatus){

document_type ("tender","loa","po" or "other"), customer (issuing organisation short name, e.g. BPCL), beneficiary (full legal name of the organisation the bond favours), beneficiary_class ("Public" for PSU/government, else "Private"), applicant_name (the contractor / bidder the document is addressed to), project_name, tender_ref (tender / bidding document number), loa_number, loa_date (YYYY-MM-DD), bond_type (one of "Bid Bond","Performance Bond","Advance Bond","Retention Bond","Additional Security Bond"; an LOA asking for a performance guarantee / security deposit is "Performance Bond"), security_percent (number, bond as % of contract value), bond_amount_inr (number in rupees; 1 crore = 10000000), contract_value_inr (number in rupees, excluding GST if stated), security_due_days (days from LOA date to submit the bond), completion_months (number, contract completion period), defect_liability_months (number, defect liability / guarantee period after completion, if stated), bid_submission_date (YYYY-MM-DD), bid_validity_days, additional_days, claim_period_days, bond_start, bond_expiry, claim_expiry (YYYY-MM-DD), wording_flags (array: clauses the CSO must check, e.g. "Irrevocable and unconditional", "As per proforma in bidding document", "GCC clause 18 / SCC clause 71"), missing (array: details this document does not state), notes (array: other important points).`;

<script>
/* ============ v18: reading accuracy report + teach PI labels per insurer ============ */
const PIF=[['pi_number','PI number','code','no'],['pi_date','PI date','date','date'],['premium','Net premium','amount','premium'],['cgst','CGST','amount','cgst'],['sgst','SGST','amount','sgst'],['igst','IGST','amount','igst'],
  ['bank_account','Bank account number','acct','account'],['ifsc','IFSC','ifsc','ifsc'],['bank_name','Bank name','text','bank'],['bank_payee','Payee / account name','text','payee'],['insurer_gstin','Insurer GSTIN','gstin','insurerGstin'],['billed_to_gstin','Our GSTIN on PI','gstin','billedGstin']];

const REQF=[['cust','Customer'],['beneficiary','Beneficiary'],['entity','Legal entity'],['type','Bond type'],['amount','Bond amount'],['contractValue','Contract value'],['tenderRef','Tender / contract ref'],['requiredBy','Required by'],['project','Project name']];

  const E=Object.entries(MDEF);Object.keys(MDEF).forEach(k=>delete MDEF[k]);E.forEach(([k,v])=>{MDEF[k]=v;if(k==='insDocs')MDEF.piLabels=pl});if(!MDEF.piLabels)MDEF.piLabels=pl})();

/* extraction by label */
const reEsc=s=>String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const VAL={amount:'([\\d,]+(?:\\.\\d+)?)',date:'(\\d{1,2}[.\\-\\/]\\d{1,2}[.\\-\\/]\\d{4})',acct:'(\\d{6,20})',ifsc:'([A-Z]{4}0[A-Z0-9]{6})',gstin:'(\\d{2}[A-Z]{5}\\d{4}[A-Z][1-9A-Z]Z[0-9A-Z])',code:'([A-Z0-9][A-Z0-9\\/\\-]*)',text:'([A-Za-z][A-Za-z0-9 .,&\\-]{1,60}?)(?=\\s+(?:[A-Z][A-Za-z ]{2,30}\\s*[:\\-]|Account|Bank|IFSC|Branch|PAN|GST)|$)'};

let LASTTEXT='';

const _oc18=ocrCanvases;ocrCanvases=async function(...a){const t=await _oc18(...a);LASTTEXT=t||'';return t};

const _pfr18=piFromRules;piFromRules=function(t){const x=_pfr18(t),b=bond(ui.bond);if(b)x._labels=applyLabels(x,b.insurer,t,false);return x};
const _rf18=readFields;readFields=async function(file,prompt,ruleFn,onS){const b=bond(ui.bond),isPi=prompt===OCR_PI17;
  if(isPi&&b){const L=labelsFor(b.insurer);if(L.length)prompt+='\n\nOn '+b.insurer+'\'s PIs these labels are used: '+L.map(l=>l.field+' = "'+l.label+'"').join('; ')+'.'}
